  --green:#4cc79b; --green-s:#12332a; --red:#f08a84; --red-s:#3a1c1a;
  --amber:#e3b04b; --amber-s:#33280f;
  --mk-good:#06a05c; --mk-warn:#a17904; --mk-bad:#b3260e;
  --i1:#184f95; --i2:#256abf; --i3:#3987e5; --i4:#6da7ec; --i5:#9ec5f4;
  --fi1:#eef1f5; --fi2:#eef1f5; --fi3:#0d0f13; --fi4:#0d0f13; --fi5:#0d0f13;
}}
:root[data-theme="dark"]{
  --bg:#0d0f13; --panel:#161a20; --panel2:#1d222a; --line:#282e38; --line2:#39414e;
  --ink:#eef1f5; --ink2:#aeb6c2; --ink3:#79828f;
  --blue:#6da7ec; --blue-s:#1b2c44; --orange:#e8845a; --orange-s:#3a2318;
  --green:#4cc79b; --green-s:#12332a; --red:#f08a84; --red-s:#3a1c1a;
  --amber:#e3b04b; --amber-s:#33280f;
  --mk-good:#06a05c; --mk-warn:#a17904; --mk-bad:#b3260e;
  --i1:#184f95; --i2:#256abf; --i3:#3987e5; --i4:#6da7ec; --i5:#9ec5f4;
  --fi1:#eef1f5; --fi2:#eef1f5; --fi3:#0d0f13; --fi4:#0d0f13; --fi5:#0d0f13;

body{background:var(--bg);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px;padding-block:26px 60px}
h1{font-size:23px;letter-spacing:-.02em;margin:0 0 3px;font-weight:650}

.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;font:inherit;font-size:14px;font-weight:550;
     color:var(--ink3);padding:9px 15px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px}

.kpi.pos .v{color:var(--green)} .kpi.neg .v{color:var(--red)} .kpi.warn .v{color:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);

.hmt{table-layout:fixed}

td.hm.i0{color:var(--ink3)}
td.hm.i1{background:var(--i1);color:var(--fi1)}
td.hm.i2{background:var(--i2);color:var(--fi2)}
td.hm.i3{background:var(--i3);color:var(--fi3)}
td.hm.i4{background:var(--i4);color:var(--fi4)}

.leg b.sw{width:16px;height:9px;border-radius:2px}

.leg b.sw.i3{background:var(--i3)} .leg b.sw.i4{background:var(--i4)}

tr.sl:hover td{background:var(--panel2)}

<div class="wrap">
  <div class="hdr">
    <div>
      <h1>Grupo VICOMER</h1>
      <p class="sub" id="fuenteSub"></p>
    </div>

      <span class="badge" id="perBadge"></span>
      <span class="badge" id="cuadreBadge"></span>
      <span class="badge" id="antBadge"></span>
      <span class="badge" id="tcBadge"></span>
      <div class="tog" id="curTog">
        <button data-c="COP" aria-pressed="true">Pesos COP</button>
        <button data-c="USD" aria-pressed="false">Dólares USD</button>
      </div>
    </div>
  </div>

  <div class="secs" id="secs">
    <button class="sec" data-s="fin" aria-pressed="true">Estados financieros</button>
    <button class="sec" data-s="ven" aria-pressed="false">Ventas y cartera</button>
    <button class="sec" data-s="inv" aria-pressed="false">Salud de inventario</button>
  </div>

  <div class="rango" id="rango">
    <div class="rgrp">
      <label for="rDesde">Desde</label><select id="rDesde"></select>
      <label for="rHasta">hasta</label><select id="rHasta"></select>
    </div>

</div>

<script>
const DATA = /*__DATOS__*/null/*__FIN__*/;

var CUR = "COP"; // moneda de presentación de Colombia
function TC(){ return 1/DATA.meta.trm; }
function conv(v,pais){ return (pais==="CO" && CUR==="USD") ? v*TC() : v; }
function sym(pais){ return (pais==="CO" && CUR==="USD") ? "US$ " : "$ "; }
function fm(v,d){ if(v===null||v===undefined) return "—";
  d = (d===undefined) ? 0 : d;
  return v.toLocaleString("es-EC",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function money(v,pais,d){ return (v<0?"−":"")+sym(pais)+fm(Math.abs(conv(v,pais)),d); }
// En los estados financieros un importe negativo es un COSTO: se escribe entre paréntesis,
// como en cualquier reporte contable, no con un signo menos suelto.
function moneyP(v,pais,d){
  if(v === null || v === undefined) return "—";
  var t = sym(pais)+fm(Math.abs(conv(v,pais)),d);
  return v < 0 ? "("+t+")" : t;
}
function pct(v,d){ if(v===null||v===undefined) return "—";
  return (v*100).toLocaleString("es-EC",{minimumFractionDigits:(d===undefined?1:d),
    maximumFractionDigits:(d===undefined?1:d)})+"%"; }
function esc(s){ return String(s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function sum(a){ return a.reduce(function(s,x){return s+x.v;},0); }

/* =====================================================================
   RANGO DE FECHAS
   El estado de resultados es un FLUJO: se suma sobre el rango.
   El balance es un SALDO: es la foto del ultimo mes del rango, jamas una suma.
   Y el patrimonio de esa foto carga el resultado ACUMULADO DEL ANO, no el del
   rango, o el balance no cierra. Esa distincion es la razon de ser de este bloque.
   ===================================================================== */
var RA = 1, RB = 1;   // mes desde, mes hasta

function serie(cod){ return ((DATA.serie||{})[cod]||{}).buckets || []; }

function rangoPais(cod, a, b){
  // Un bucket entra solo si el periodo que cubre cae ENTERO en el rango. El bloque
  // de la migracion cubre varios meses y por eso no se puede trocear: o entra
  // completo o se declara como hueco. Antes de estimar, se muestra el hueco.
  var dentro = [], fuera = [];
  serie(cod).forEach(function(k){
    if(!k.vivo) return;
    if(k.cubre[0] >= a && k.cubre[1] <= b) dentro.push(k);
    else if(k.cubre[1] >= a && k.cubre[0] <= b) fuera.push(k);
  });
  return {dentro:dentro, fuera:fuera};
}

function acumHasta(cod, b){
  // Resultado acumulado del ANO hasta el mes b: lo que el patrimonio del balance
  // tiene que estar cargando para que la foto cuadre.
  var r = 0;
  serie(cod).forEach(function(k){
    if(k.vivo && k.cubre[1] <= b){
      var y = k.pyg;
      r += y.ing - y.cogs - y.gv - y.ga - y.gf - y.g4;
    }
  });
  return r;
}

function fotoDe(cod, b){
  var ult = null;
  serie(cod).forEach(function(k){ if(k.cubre[1] <= b) ult = k; });
  return ult;
}

function construirPais(cod, a, b){
  var base = DATA[cod], r = rangoPais(cod, a, b), foto = fotoDe(cod, b);
  if(!r.dentro.length || !foto) return null;
  var y = {ing:0,cogs:0,gv:0,ga:0,gf:0,g4:0};
  r.dentro.forEach(function(k){ for(var z in y) y[z] += k.pyg[z]; });
  var ub = y.ing - y.cogs, uo = ub - y.gv - y.ga, uai = uo - y.gf, neto = uai - y.g4;

  // EL COSTO NO SIGUE A LA VENTA. Medido el 2026-10-07: Colombia registra 0% de costo en
  // abril y mayo, 462% en julio; Ecuador 5,9% en octubre. El costo entra por ajustes de
  // inventario periodicos, no contra cada venta. Por eso un margen de rango corto no es
  // un margen: es el calendario del ajuste. Se calcula la credibilidad y, si no la hay,
  // NO se publica el porcentaje. Mostrar 100% de margen bruto seria inventar una cifra.
  var ratio = y.ing ? y.cogs/y.ing : null;
  var anio = (function(){ var i=0,c=0; serie(cod).forEach(function(k){
        if(k.vivo){ i+=k.pyg.ing; c+=k.pyg.cogs; } }); return i ? c/i : null; })();
  var sinCosto = !!(y.ing > 0 && Math.abs(y.cogs) < 0.005);
  var dudoso = !!(ratio!==null && anio!==null && Math.abs(ratio-anio) > 0.20);
  var creible = !sinCosto && !dudoso;
  var costo = {ratio:ratio, ratio_anio:anio, sin_costo:sinCosto, dudoso:dudoso, creible:creible};
  var etq4 = (cod==="CO") ? "(−) Impuesto a la renta" : "(−) Gastos no deducibles";
  var P = function(v){ return y.ing ? Math.round(v/y.ing*1e4)/1e4 : null; };
  // Los porcentajes que dependen del costo se publican solo si el costo es creible.
  var PC = function(v){ return creible ? P(v) : null; };
  var pl = [
    {k:"Ventas netas", v:y.ing, t:"s", b:"ing"},
    {k:"(−) Costo de ventas", v:-y.cogs, t:"r", b:"cogs"},
    {k:"Utilidad bruta", v:ub, t:"S", pct:PC(ub)},
    {k:"(−) Gastos de ventas", v:-y.gv, t:"r", b:"gv"},
    {k:"(−) Gastos administrativos", v:-y.ga, t:"r", b:"ga"},
    {k:"Utilidad operativa (EBIT)", v:uo, t:"S", pct:PC(uo)},
    {k:"(−) Gastos financieros", v:-y.gf, t:"r", b:"gf"},
    {k:"Utilidad antes de impuestos", v:uai, t:"S", pct:PC(uai)},
    {k:etq4, v:-y.g4, t:"r", b:"g4"},
    {k:"Resultado del período", v:neto, t:"F", pct:PC(neto)}
  ];

  var g = foto.bg, ytd = acumHasta(cod, b);
  var mesFin = DATA.serie.meses[foto.cubre[1]-1];
  var esYTD = (r.dentro[0].cubre[0] === 1 && foto.cubre[1] === b);
  var bg = {
    activo:[
      {k:"Efectivo y bancos", v:g.efectivo, sub:g.efectivo_sub, cl:"efectivo"},
      {k:"Cuentas por cobrar clientes", v:g.cxc, cl:"cuentas_por_cobrar"},
      {k:"Inventarios y mercadería en tránsito", v:g.inventarios, sub:g.inventarios_sub, cl:"inventarios"},
      {k:"Otros activos corrientes", v:g.otros_ac, sub:g.otros_ac_sub, cl:"otros_activos_corrientes"}],
    activo_nc: Math.abs(g.anc)>1 ? [{k:"Propiedad, planta y equipo (neto)", v:g.anc, sub:g.anc_sub,
      cl:"activo_no_corriente"}] : [],
    pasivo:[
      {k:"Proveedores y cuentas por pagar", v:g.cxp, sub:g.cxp_sub, cl:"cuentas_por_pagar"},
      {k:"Deuda financiera corto plazo", v:g.df, sub:g.df_sub, cl:"deuda_financiera"},
      {k:"Impuestos por pagar", v:g.imp, cl:"impuestos_por_pagar"},
      {k:"Otros pasivos corrientes", v:g.otros_pc, sub:g.otros_pc_sub, cl:"otros_pasivos_corrientes"}],
    pasivo_nc: Math.abs(g.pnc)>1 ? [{k:"Pasivo no corriente", v:g.pnc, sub:g.pnc_sub,
      cl:"pasivo_no_corriente"}] : [],
    patrimonio:[
      {k:"Capital y resultados acumulados", v:g.patrimonio_sr, sub:g.patrimonio_sub, cl:"patrimonio"},
      {k:"Resultado del ejercicio", v:ytd,
       sub: esYTD ? ("Ene–"+mesFin+" "+DATA.meta.anio_txt)
                  : ("Acumulado del año Ene–"+mesFin+", NO del rango seleccionado: el patrimonio "+
                     "arrastra todo el ejercicio o el balance no cerraría")}]
  };
  var ac = g.efectivo+g.cxc+g.inventarios+g.otros_ac, at = ac+g.anc;
  var pc = g.cxp+g.df+g.imp+g.otros_pc, pt = pc+g.pnc, pat = g.patrimonio_sr+ytd;
  bg.descuadre_esperado = Math.round((at-pt-pat)*100)/100;

  // Dias del rango: del primer dia del primer periodo incluido al cierre del ultimo.
  var d0 = new Date(DATA.meta.anio+"-"+("0"+r.dentro[0].cubre[0]).slice(-2)+"-01T00:00:00");
  var d1 = new Date(foto.hasta+"T00:00:00");
  var dias = Math.max(1, Math.round((d1-d0)/864e5)+1);
  var R = function(v,n){ var f=Math.pow(10,n||2); return Math.round(v*f)/f; };
  var dso = y.ing ? g.cxc/(y.ing/dias) : null;
  var dio = y.cogs ? g.inventarios/(y.cogs/dias) : null;
  var dpo = y.cogs ? g.proveedor_comercial/(y.cogs/dias) : null;
  var dfT = g.df + g.pnc;
  var ind = {
    mb:PC(ub), mo:PC(uo), mn:PC(neto), gastos_pct:P(y.gv+y.ga),
    liquidez: pc ? R(ac/pc) : null, acida: pc ? R((ac-g.inventarios)/pc) : null,
    ctrabajo: R(ac-pc), endeud: at ? R(pt/at,3) : null, apal: pat ? R(pt/pat) : null,
    df: R(dfT), df_act: at ? R(dfT/at,3) : null,
    roa: at ? R(neto/at,4) : null, roe: pat ? R(neto/pat,4) : null,
    roa_a: at ? R(neto/at*365/dias,4) : null, roe_a: pat ? R(neto/pat*365/dias,4) : null,
    dso: dso?Math.round(dso):null, dio: dio?Math.round(dio):null, dpo: dpo?Math.round(dpo):null,
    ccc: (dso&&dio&&dpo)?Math.round(dso+dio-dpo):null,
    proveedor_comercial: g.proveedor_comercial, intercia: g.intercia
  };
  var et0 = r.dentro[0].etiqueta.split("–")[0], et1 = r.dentro[r.dentro.length-1].etiqueta;
  et1 = et1.indexOf("–")>-1 ? et1.split("–")[1] : et1;
  return {pais:base.pais, empresa:base.empresa, moneda:base.moneda,
          periodo: (et0===et1 ? et0 : et0+" – "+et1)+" "+DATA.meta.anio_txt,
          corte_balance: foto.hasta, dias: dias, pl:pl, bg:bg, ind:ind, costo:costo,
          notas: base.notas, fuera: r.fuera, esYTD: esYTD};
}

function costoHTML(d, cod){
  var c = d.costo; if(!c || c.creible) return "";
  var pr = function(x){ return x===null ? "—" : (x*100).toFixed(1).replace(".",",")+"%"; };
  var txt = c.sin_costo
    ? ("En este rango la contabilidad no registra NADA de costo de ventas contra "+
       money(d.pl[0].v, cod, 0)+" de venta. El margen bruto saldría 100%, que es imposible en "+
       "distribución: no es un margen, es un costo que todavía no se contabilizó.")
    : ("El costo de ventas de este rango pesa "+pr(c.ratio)+" sobre la venta, contra "+
       pr(c.ratio_anio)+" del año completo. El costo entra por ajustes de inventario "+
       "periódicos y no contra cada venta, así que en un rango corto el margen mide el "+
       "calendario del ajuste, no el negocio.");
  return '<div class="hueco"><b>El margen de este rango no es publicable</b>'+esc(txt)+
    ' Las cifras en moneda se muestran tal como están contabilizadas; los porcentajes que '+
    'dependen del costo quedan en «—» en vez de inventarse. Para leer margen, usá «Año a la fecha».</div>';
}

function huecoHTML(d){
  if(!d.fuera || !d.fuera.length) return "";
  return '<div class="hueco"><b>Hay períodos que este rango no puede incluir</b>'+
    d.fuera.map(function(k){
      return esc(k.etiqueta)+' queda parcialmente dentro del rango y no se puede partir. '+
        esc(k.motivo_bloque || "")+' Sus '+money(k.pyg.ing, null, 0).replace("$ ","")+
        ' de venta quedan FUERA del estado de resultados de arriba.';
    }).join(" ")+
    ' Se muestra el hueco en vez de estimarlo: una cifra partida a ojo no es un estado financiero.</div>';
}

/* ---------- Estado de resultados en cascada ---------- */
function plHTML(d,pais){
  var base = Math.max.apply(null, d.pl.map(function(r){return Math.abs(r.v);}));
  var rows = d.pl.map(function(r){
    var w = Math.abs(r.v)/base*100;
    var col = r.v<0 ? "var(--orange)" : (r.t==="F"||r.t==="S"||r.t==="s" ? "var(--blue)" : "var(--green)");
    if(r.t==="F") col = r.v<0 ? "var(--red)" : "var(--green)";
    var cls = (r.t==="S"||r.t==="F"||r.t==="s") ? r.t : "";
    return '<tr class="'+cls+'">'+
      '<td>'+esc(r.k)+(r.flag?'<span class="flagdot"></span>':'')+
        '<div class="bar" style="height:5px;margin-top:4px"><i style="width:'+w.toFixed(1)+
        '%;background:'+col+'"></i></div></td>'+
      '<td class="n" style="color:'+(r.v<0?"var(--ink2)":"inherit")+'">'+money(r.v,pais,2)+'</td>'+
      '<td class="n">'+(r.pct!==undefined?pct(r.pct):"")+'</td></tr>';
  }).join("");
  return '<div class="scroll"><table><thead><tr><th>'+esc(d.pl_periodo||d.periodo)+
    '</th><th>Monto</th><th>% ventas</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- Balance ---------- */
function bgHTML(d,pais){
  var b = d.bg;
  var ac = sum(b.activo), anc = sum(b.activo_nc), at = ac+anc;
  var pc = sum(b.pasivo), pnc = sum(b.pasivo_nc), pt = pc+pnc, pat = sum(b.patrimonio);
  function block(titulo, items, total, color){
    var rows = items.map(function(i){
      var w = Math.abs(i.v)/at*100;
      return '<tr><td>'+esc(i.k)+(i.flag?'<span class="flagdot"></span>':'')+
        (i.sub?'<span class="sub2">'+esc(i.sub)+'</span>':'')+
        '<div class="bar" style="height:4px"><i style="width:'+w.toFixed(1)+'%;background:'+color+'"></i></div></td>'+
        '<td class="n">'+money(i.v,pais,0)+'</td>'+
        '<td class="n" style="color:var(--ink3)">'+pct(i.v/at,1)+'</td></tr>';
    }).join("");
    return '<tr class="s"><td>'+titulo+'</td><td class="n">'+money(total,pais,0)+
      '</td><td class="n">'+pct(total/at,1)+'</td></tr>'+rows;
  }
  var t = '<div class="scroll"><table><thead><tr><th>Cuenta</th><th>Monto</th><th>% activo</th></tr></thead><tbody>';
  t += block("ACTIVO CORRIENTE", b.activo, ac, "var(--blue)");
  if(b.activo_nc.length) t += block("ACTIVO NO CORRIENTE", b.activo_nc, anc, "var(--blue)");
  t += '<tr class="S"><td>TOTAL ACTIVO</td><td class="n">'+money(at,pais,0)+'</td><td class="n">100,0%</td></tr>';
  t += block("PASIVO CORRIENTE", b.pasivo, pc, "var(--orange)");
  if(b.pasivo_nc.length) t += block("PASIVO NO CORRIENTE", b.pasivo_nc, pnc, "var(--orange)");
  t += '<tr class="S"><td>TOTAL PASIVO</td><td class="n">'+money(pt,pais,0)+'</td><td class="n">'+pct(pt/at,1)+'</td></tr>';
  t += block("PATRIMONIO", b.patrimonio, pat, "var(--green)");
  var dif = (b.descuadre_esperado !== undefined) ? b.descuadre_esperado : (at - pt - pat);
  t += '<tr class="F"><td>PASIVO + PATRIMONIO</td><td class="n">'+money(pt+pat,pais,0)+'</td><td class="n">'+
       pct((pt+pat)/at,1)+'</td></tr>';
  t += '<tr><td style="color:'+(Math.abs(dif)<1?"var(--green)":"var(--red)")+
       ';font-weight:600">Descuadre</td><td class="n" style="color:'+
       (Math.abs(dif)<1?"var(--green)":"var(--red)")+'">'+money(dif,pais,2)+'</td><td></td></tr>';
  t += '</tbody></table></div>';

  var st = '<div class="leg"><span><b style="background:var(--orange)"></b>Pasivo '+pct(pt/at,0)+'</span>'+
    '<span><b style="background:var(--green)"></b>Patrimonio '+pct(pat/at,0)+'</span></div>'+
    '<div class="stack"><i style="width:'+(pt/at*100)+'%;background:var(--orange)">Pasivo</i>'+
    '<i style="width:'+(pat/at*100)+'%;background:var(--green)">Patrimonio</i></div>'+
    '<div style="font-size:11.5px;color:var(--ink3)">Cada dólar de activo está financiado con '+
    pct(pt/at,0)+' de terceros y '+pct(pat/at,0)+' de recursos propios.</div>';
  return st + t;
}

/* ---------- KPIs ---------- */
function kpi(l,v,n,cls){ return '<div class="kpi '+(cls||"")+'"><div class="l">'+l+
  '</div><div class="v">'+v+'</div>'+(n?'<div class="n">'+n+'</div>':'')+'</div>'; }

function linea(d,t){ var r=null; d.pl.forEach(function(x){ if(x.t===t) r=x; }); return r; }

function kpis(d,cod){
  // Genericos: salen del P&G y del balance del propio pais. Antes estaban escritos a
  // mano por pais, que es como se cuelan cifras de un corte viejo sin que nadie lo note.
  var i=d.ind, vta=linea(d,"s"), ub=d.pl.filter(function(x){return x.t==="S";})[0],
      neto=linea(d,"F"), s=sumaBG(d);
  var ciclo = (i.ccc!==null && i.ccc!==undefined);
  return kpi("Ventas netas", money(vta.v,cod,0), d.periodo)+
    kpi("Utilidad bruta", money(ub.v,cod,0),
        (i.mb===null||i.mb===undefined) ? "margen no medible en este rango" : pct(i.mb)+" de margen")+
    kpi("Utilidad operativa", money(linea(d,"S")?d.pl.filter(function(x){return x.t==="S";})[1].v:0,cod,0),
        (i.mo===null||i.mo===undefined) ? "sobre ventas: no medible" : pct(i.mo)+" de las ventas")+
    kpi("Resultado del período", money(neto.v,cod,0),
        (i.mn===null||i.mn===undefined) ? "sobre ventas: no medible" : pct(i.mn)+" de las ventas",
        neto.v>=0?"pos":"neg")+
    kpi("Razón corriente", i.liquidez.toFixed(2), "Ácida "+i.acida.toFixed(2))+
    (ciclo ? kpi("Ciclo de caja", i.ccc+" días",
        "Cobro "+i.dso+" + Inv "+i.dio+" − Pago "+i.dpo, i.ccc>200?"neg":"warn")
           : kpi("Caja disponible", money(s.caja,cod,0), "En bancos"));
}

/* ---------- Indicadores ---------- */
function indRow(l,v,n,cls){ return '<tr><td>'+l+(n?'<span class="sub2">'+esc(n)+'</span>':'')+
  '</td><td class="n" style="font-weight:640'+(cls?';color:var(--'+cls+')':'')+'">'+v+'</td></tr>'; }

function indicadores(d,cod){

  var filaDF = (i.df>0)
    ? indRow("Deuda financiera",money(i.df,cod,0),pct(i.df_act,0)+" del activo · toda de corto plazo salvo lo declarado","amber")
    : indRow("Deuda financiera bancaria","Cero","No hay obligaciones con bancos","green");
  var extra = (cod==="CO")
    ? indRow("Peso de la casa matriz",pct(i.intercia*1.0/(sum(d.bg.pasivo)+sum(d.bg.pasivo_nc))),
             "Por pagar a VICOMER "+money(i.intercia,cod,0),"amber")
    : indRow("Por cobrar a la filial",money(i.intercia,cod,0),"Saldo con VINTRAL, sin movimiento desde julio","amber");
  return '<div class="grid2" style="gap:14px">'+
  '<table><thead><tr><th>Rentabilidad</th><th></th></tr></thead><tbody>'+
    indRow("Margen bruto",pct(i.mb))+
    indRow("Margen operativo",pct(i.mo))+
    indRow("Margen neto",pct(i.mn),null,i.mn>=0?"green":"red")+
    indRow("Gastos operativos / ventas",pct(i.gastos_pct))+
    indRow("ROA",pct(i.roa),"Del período · anualizado "+pct(i.roa_a))+
    indRow("ROE",pct(i.roe),"Del período · anualizado "+pct(i.roe_a),"green")+
  '</tbody></table>'+
  '<table><thead><tr><th>Estructura y liquidez</th><th></th></tr></thead><tbody>'+
    indRow("Razón corriente",i.liquidez.toFixed(2),"Activo corriente / pasivo corriente")+
    indRow("Prueba ácida",i.acida.toFixed(2),"Sin inventarios ni mercadería en tránsito")+
    indRow("Capital de trabajo",money(i.ctrabajo,cod,0))+
    indRow("Endeudamiento",pct(i.endeud),"Pasivo / activo")+
    indRow("Apalancamiento",i.apal.toFixed(2)+"×","Pasivo / patrimonio")+
    filaDF + extra +
  '</tbody></table></div>';
}

/* ---------- Ciclo de caja ---------- */
function cccHTML(d,cod){
  var i=d.ind;
  if(i.ccc===null || i.ccc===undefined)
    return '<p style="color:var(--ink3);font-size:12.5px">Sin costo de ventas registrado: '+
           'el ciclo de inventario no es calculable.</p>';
  var vta=linea(d,"s").v, vd=vta/DATA.meta.dias;
  return '<div class="ccc">'+
    '<div><div class="lab">Días de cobro</div><div class="num" style="color:var(--blue)">'+i.dso+'</div>'+
      '<div style="font-size:11px;color:var(--ink3)">Cartera de clientes</div></div>'+
    '<div><div class="lab">+ Días de inventario</div><div class="num" style="color:var(--orange)">'+i.dio+'</div>'+
      '<div style="font-size:11px;color:var(--ink3)">Mercadería y tránsito</div></div>'+
    '<div><div class="lab">− Días de pago</div><div class="num" style="color:var(--green)">'+i.dpo+'</div>'+
      '<div style="font-size:11px;color:var(--ink3)">Proveedores comerciales</div></div>'+
    '<div style="background:var(--panel2)"><div class="lab">= Ciclo de caja</div>'+
      '<div class="num" style="color:'+(i.ccc>200?"var(--red)":"var(--amber)")+'">'+i.ccc+'</div>'+
      '<div style="font-size:11px;color:var(--ink3)">Días financiados</div></div></div>'+
    '<p style="font-size:12.5px;color:var(--ink2);margin:8px 0 0">La operación adelanta caja '+i.ccc+
    ' días: se paga la mercadería mucho antes de cobrarla. El día de pago se calcula solo sobre '+
    'proveedores comerciales ('+money(i.proveedor_comercial,cod,0)+'); la deuda con la casa matriz '+
    'no es crédito de proveedor y meterla ahí haría creer que hay un financiamiento que no existe. '+

/* ---------- Grupo ---------- */
function sumaBG(d){
  var b=d.bg;
  var at=sum(b.activo)+sum(b.activo_nc), pt=sum(b.pasivo)+sum(b.pasivo_nc), pat=sum(b.patrimonio);
  var neto=0; d.pl.forEach(function(r){ if(r.t==="F") neto=r.v; });
  var caja=(b.activo[0]||{}).v||0, vta=0;
  d.pl.forEach(function(r){ if(r.t==="s") vta=r.v; });
  return {act:at, pas:pt, pat:pat, vta:vta, ut:neto, caja:caja};
}
function grupo(){
  // Los paises salen de DATA: agregar uno mas no exige tocar esta funcion.
  var tc = TC();
  var cods = Object.keys(DATA).filter(function(k){
    return k!=="meta" && k!=="conc" && DATA[k] && DATA[k].pl; });
  var P = cods.map(function(k){
    var d=construirPais(k, RA, RB) || DATA[k], f=(d.moneda==="USD")?1:tc,
        s=sumaBG(d), o={pais:d.pais, cod:k};
    ["act","pas","pat","vta","ut","caja"].forEach(function(x){ o[x]=s[x]*f; });
    return o;
  });
  var t={}; ["act","pas","pat","vta","ut","caja"].forEach(function(x){
    t[x]=P.reduce(function(a,p){return a+p[x];},0); });
  function usd(v,d){ return "US$ "+fm(v,(d===undefined?0:d)); }
  var filas=[["Ventas netas", "vta"],["Activo total","act"],["Pasivo total","pas"],
             ["Patrimonio","pat"],["Resultado del ejercicio","ut"]].map(function(f){
    return '<tr><td>'+f[0]+'</td>'+P.map(function(p){
        return '<td class="n">'+usd(p[f[1]])+'</td>';}).join("")+
      '<td class="n" style="font-weight:640">'+usd(t[f[1]])+'</td></tr>';}).join("");
  var enc = P.map(function(p){ return '<th>'+esc(p.pais)+'</th>'; }).join("");
  var barras = P.map(function(p,i){
    var col = i===0 ? "var(--blue)" : (i===1 ? "var(--orange)" : "var(--green)");
    return '<i style="width:'+(p.vta/t.vta*100)+'%;background:'+col+'">'+
      esc(p.pais)+' '+pct(p.vta/t.vta,0)+'</i>'; }).join("");

  var dCO = construirPais("CO", RA, RB) || DATA.CO, dEC = construirPais("EC", RA, RB) || DATA.EC;

    kpi("Caja disponible", usd(t.caja), pct(t.caja/t.act,1)+" del activo","neg")+
  '</div>'+
  '<div class="card"><h2>Comparativo por país</h2>'+
    '<p class="cap" style="margin-bottom:2px">'+esc(rangoTexto())+'</p>'+
    '<p class="cap">Colombia convertida a dólares con la TRM del '+esc(DATA.meta.trm_fecha)+
    ' ('+fm(DATA.meta.trm,2)+' COP/USD). Dimensiona el grupo; no reemplaza una consolidación '+
    'con eliminaciones intercompañía.</p>'+
    '<div class="scroll"><table><thead><tr><th>Concepto</th>'+enc+
    '<th>Grupo</th></tr></thead><tbody>'+filas+'</tbody></table></div>'+

    '<div style="font-size:11.5px;color:var(--ink3)">Participación en las ventas del grupo</div></div>'+
  concHTML()+
  '<div class="card"><h2>Lo que hay que resolver antes de consolidar</h2><ul class="notes">'+
   '<li class="crit"><b>La cuenta entre las dos empresas no cuadra, y una de las dos no la está moviendo</b>'+
     'VINTRAL registra por pagar a VICOMER '+fm(icCO,0)+' COP, que a la TRM de hoy son '+usd(icCOusd)+
     '. VICOMER registra por cobrar '+usd(icEC)+', el mismo saldo que tenía en julio. '+
     'La diferencia es '+usd(icDif)+'. Que el lado ecuatoriano no se mueva en dos meses mientras el '+
     'colombiano sí, señala que los asientos se están registrando en una sola de las dos compañías.</li>'+
   '<li class="crit"><b>Dos fuentes contables que no dicen lo mismo</b>'+
     'Ecuador reproduce el estado oficial de julio al centavo; Colombia difiere en 227 millones de '+
     'activo y 183 de pasivo a esa misma fecha. Mientras eso siga abierto, el grupo no tiene una '+
     'cifra consolidada que se pueda firmar.</li>'+
   '<li class="warn"><b>Los ciclos de caja se deterioraron</b>'+
     'Ecuador pasó de 130 a 170 días y Colombia de 244 a 339. El grupo factura '+usd(t.vta)+
     ' en el año y tiene '+usd(t.caja)+' en caja. La utilidad existe; la liquidez no.</li>'+
   '<li class="info"><b>Costa Rica queda fuera</b>'+
     'La compañía existe en Odoo pero no registra costo de ventas: su margen sale 100%, que es '+
     'imposible en distribución. No es un dato, es un hueco, y por eso no entra al consolidado.</li>'+
   '</ul></div>';
}

/* =====================================================================
   VENTAS Y CARTERA
   Misma disciplina que el estado financiero: la FACTURACION es un flujo y se
   suma sobre el rango; la CARTERA es un saldo y es la foto del corte, no del
   rango. Los meses sin factura en Odoo (los anteriores a la migracion) se
   declaran como hueco: existen en la contabilidad como asiento de traslado,
   sin detalle de cliente, y partirlos seria inventarlos.
   ===================================================================== */
function vpais(cod){ return (DATA.ventas || {})[cod] || null; }
function vcods(){ return Object.keys(DATA.ventas || {}).filter(function(k){ return k !== "meta"; }); }

function histMes(cod, m){
  // Snapshot estatico de los sistemas anteriores. Trae el total del mes, nunca clientes.
  var h = ((vpais(cod) || {}).historico || {}).meses || {};
  var v = h[String(m)];
  return (v === undefined || v === null) ? null : v;
}

function ventasRango(cod, a, b){
  var V = vpais(cod); if(!V) return null;
  var dentro = V.meses.filter(function(m){ return m.vivo && m.m >= a && m.m <= b; });
  var faltan = [], hist = [], ventaHist = 0;
  for(var m = a; m <= b; m++){
    var x = V.meses.filter(function(y){ return y.m === m; })[0];
    var hv = histMes(cod, m);
    if(hv !== null){ hist.push({m:m, v:hv}); ventaHist += hv; continue; }
    if(V.primer_mes && m < V.primer_mes) faltan.push(DATA.serie.meses[m-1]);
    else if(x && !x.vivo) faltan.push(DATA.serie.meses[m-1]);
  }
  var venta = ventaHist, fact = 0, cli = {};
  dentro.forEach(function(m){
    venta += m.venta; fact += m.n_facturas;
    m.clientes.forEach(function(c){
      var e = cli[c.id] || (cli[c.id] = {n:c.n, v:0, f:0});
      e.v += c.v; e.f += c.f;
    });
  });
  var ventaOdoo = venta - ventaHist;   // solo lo que tiene detalle por cliente
  var lista = Object.keys(cli).map(function(k){ return cli[k]; })
                    .sort(function(x,y){ return Math.abs(y.v)-Math.abs(x.v); });
  var tot = lista.reduce(function(acc,x){ return acc + Math.abs(x.v); }, 0);   // base = solo Odoo
  var hhi = tot ? Math.round(lista.reduce(function(acc,x){
      var w = Math.abs(x.v)/tot; return acc + w*w; }, 0) * 10000) : null;
  var top5 = tot ? lista.slice(0,5).reduce(function(acc,x){ return acc+Math.abs(x.v); },0)/tot : null;
  // Periodo anterior del mismo largo, para comparar contra algo y no contra nada.
  var largo = b - a + 1, pa = a - largo, pb = a - 1, prev = null;
  if(pa >= 1){
    var suma = 0, completo = true;
    for(var q = pa; q <= pb; q++){
      var hq = histMes(cod, q);
      if(hq !== null){ suma += hq; continue; }
      var mq = V.meses.filter(function(y){ return y.m === q; })[0];
      if(mq && mq.vivo) suma += mq.venta; else completo = false;
    }
    if(completo) prev = suma;
  }
  return {pais:V.pais, moneda:V.moneda, venta:venta, venta_odoo:ventaOdoo, venta_hist:ventaHist,
          facturas:fact, meses:dentro.length + hist.length, meses_odoo:dentro.length,
          hist:hist, historico:V.historico || null,
          clientes:lista, n_clientes:lista.length, hhi:hhi, top5:top5,
          prev:prev, faltan:faltan, cartera:V.cartera, primer_mes:V.primer_mes,
          nota_hueco:V._nota_hueco};
}

function barrasVentas(cod, a, b){
  var V = vpais(cod); if(!V) return "";
  var vals = V.meses.map(function(m){
    var hv = histMes(cod, m.m);
    return {m:m.m, v: hv !== null ? hv : (m.vivo ? m.venta : null), hist: hv !== null};
  });
  var max = Math.max.apply(null, vals.map(function(x){ return Math.abs(x.v||0); }).concat([1]));
  var hayHist = vals.filter(function(x){ return x.hist; }).length > 0;
  var barras = vals.map(function(x){
    var on = (x.m >= a && x.m <= b && x.v !== null);
    var h = x.v === null ? 2 : Math.max(2, Math.abs(x.v)/max*100);
    var cls = (on ? "on " : "") + (x.hist ? "hist" : "");
    return '<div><b>'+(x.v === null ? "—" : fm(conv(x.v,cod)/1000,0))+'</b>'+
      '<i class="'+cls.trim()+'" style="height:'+h.toFixed(0)+'%"></i>'+
      '<span>'+esc(DATA.serie.meses[x.m-1])+'</span></div>';
  }).join("");
  return '<div class="vbar">'+barras+'</div>'+
    '<div class="leg" style="margin-top:6px"><span><b style="background:var(--blue)"></b>'+
    'Facturado en Odoo</span>'+
    (hayHist ? '<span><b style="background:var(--blue);opacity:.45"></b>'+
       esc((V.historico||{}).fuente || "sistema anterior")+' · solo el total del mes</span>' : '')+
    '<span><b style="background:var(--line2)"></b>Fuera del rango</span></div>'+
    '<div style="font-size:11.5px;color:var(--ink3)">Facturación por mes, en miles.</div>';
}

    '<tbody>'+top+'</tbody></table></div></div>';

  var hueco = avisoH + (r.faltan.length

                     : rangoTexto())+

        dV===null ? "" : (dV>=0?"pos":"neg"))+
    kpi("Facturas", fm(r.facturas,0),
        r.meses_odoo+" de "+r.meses+" mes(es) con detalle en Odoo")+

        (r.top5===null ? "" : "top 5 = "+pct(r.top5,0)) +

    kpi("Concentración", r.hhi===null ? "—" : fm(r.hhi,0),
        "HHI · sobre 2.500 es alta", (r.hhi||0)>2500?"warn":"")+
    kpi("Cartera al corte", c.disponible ? money(c.total,cod,0) : "—",
        c.disponible ? pct(c.pct_vencido,0)+" vencida" : "sin datos",
        (c.disponible && (c.pct_vencido||0)>0.4)?"neg":"")+
  '</div>';
  h += '<div class="card"><h2>Facturación mensual</h2><p class="cap">'+

  h += '<div class="grid2">'+

      '</tr></thead><tbody>'+
      r.clientes.slice(0,12).map(function(x){
        return '<tr><td>'+esc(x.n)+'</td><td class="n">'+money(x.v,cod,0)+'</td>'+
          '<td class="n" style="color:var(--ink3)">'+pct(Math.abs(x.v)/Math.abs(r.venta_odoo||r.venta||1),1)+'</td>'+
          '<td class="n" style="color:var(--ink3)">'+x.f+'</td></tr>'; }).join("")+
      '</tbody></table></div></div>'+
    '<div class="card"><h2>Cartera por antigüedad</h2><p class="cap">Foto al '+
      esc(fechaLarga(c.corte || DATA.meta.corte_iso))+

function ventasGrupo(){

            pctv:r.cartera.pct_vencido};
  }).filter(Boolean).filter(function(p){ return p.vta !== 0 || p.cart !== 0; });

  var cols = ["var(--blue)","var(--orange)","var(--green)"];
  return '<div class="kpis">'+
    kpi("Facturación del grupo", usd(t.vta), rangoTexto())+
    kpi("Facturas", fm(t.fact,0), P.length+" países con movimiento")+
    kpi("Cartera total", usd(t.cart), "Foto al corte")+
    kpi("Cartera vencida", usd(t.venc), pct(t.venc/(t.cart||1),0)+" del total",

    '<th>Facturas</th><th>Clientes</th><th>Cartera</th><th>% vencida</th></tr></thead><tbody>'+
    filas+'<tr class="S"><td>GRUPO</td><td class="n">'+usd(t.vta)+'</td><td class="n">100%</td>'+
    '<td class="n">'+fm(t.fact,0)+'</td><td class="n"></td><td class="n">'+usd(t.cart)+
    '</td><td class="n">'+pct(t.venc/(t.cart||1),0)+'</td></tr></tbody></table></div>'+
    '<div class="stack" style="margin-top:14px">'+
    P.map(function(p,i){ return '<i style="width:'+(p.vta/t.vta*100)+'%;background:'+
      cols[i%3]+'">'+esc(p.pais)+' '+pct(p.vta/t.vta,0)+'</i>'; }).join("")+'</div>'+
    '<div style="font-size:11.5px;color:var(--ink3)">Participación en la facturación del grupo</div></div>';
}

/* =====================================================================
   LECTURA EJECUTIVA — veredicto, puente, semaforos, alertas
   ===================================================================== */
var ABIERTO = {};   // filas expandidas, por clave

function kM(v, cod){
  // Resumido: k en dolares, M en pesos. El detalle siempre va a valor completo.
  if(v === null || v === undefined) return "—";
  var x = conv(v, cod), neg = x < 0, a = Math.abs(x);
  var m = (cod === "CO" && CUR !== "USD"), u = m ? 1e6 : 1e3, suf = m ? " M" : " k";
  var t = (a >= u) ? fm(a/u, a/u < 10 ? 1 : 0)+suf : fm(a, 0);
  return (neg ? "(" : "") + sym(cod) + t + (neg ? ")" : "");
}

function sem(estado){
  var C = {sano:["var(--green)","Sano"], vigilar:["var(--amber)","Vigilar"], critico:["var(--red)","Crítico"]};
  var c = C[estado] || C.vigilar;
  return '<span class="sem" style="--c:'+c[0]+'">'+c[1]+'</span>';
}
function evaluar(v, bueno, malo){
  // bueno/malo pueden venir invertidos (menos es mejor); se infiere del orden.
  if(v === null || v === undefined) return "vigilar";
  if(bueno <= malo) return v <= bueno ? "sano" : (v <= malo ? "vigilar" : "critico");
  return v >= bueno ? "sano" : (v >= malo ? "vigilar" : "critico");
}

/* ---------- Puente: de cada 100 vendidos, que queda ---------- */
function puente100(d, cod){
  var vta = linea(d,"s").v; if(!vta) return "";
  var P = d.pl, g = function(b){ var r=P.filter(function(x){return x.b===b;})[0]; return r?Math.abs(r.v):0; };
  var pasos = [
    {k:"Ingresos", v:100, t:"base"},
    {k:"Costo de la mercadería", v:-g("cogs")/vta*100},
    {k:"Gastos de ventas", v:-g("gv")/vta*100},
    {k:"Gastos administrativos", v:-g("ga")/vta*100},
    {k:"Gastos financieros", v:-g("gf")/vta*100}
  ];
  var fis = d.fiscal || {};
  if(cod === "EC"){
    pasos.push({k:"Gastos no deducibles", v:-g("g4")/vta*100});
    if(fis.participacion) pasos.push({k:"Participación 15% (estimada)", v:-fis.participacion/vta*100, est:true});
    if(fis.impuesto_renta) pasos.push({k:"Impuesto a la renta 25% (estimado)", v:-fis.impuesto_renta/vta*100, est:true});
  } else {
    pasos.push({k:"Impuesto a la renta", v:-g("g4")/vta*100});
  }
  var queda = pasos.reduce(function(a,x){ return a + (x.t==="base" ? x.v : x.v); }, 0);
  var acum = 0;
  var filas = pasos.map(function(x){
    var ini = x.t==="base" ? 0 : acum;
    acum += x.v;
    var w = Math.min(100, Math.abs(x.v));
    var col = x.t==="base" ? "var(--blue)" : "var(--orange)";
    return '<div class="wf"><div class="t">'+esc(x.k)+(x.est?' <span class="est">est.</span>':'')+'</div>'+
      '<div class="track"><i style="left:'+Math.max(0,Math.min(100,x.t==="base"?0:acum))+
      '%;width:'+w.toFixed(1)+'%;background:'+col+'"></i></div>'+
      '<div class="v">'+(x.v>0?"":"−")+fm(Math.abs(x.v),1)+'</div></div>';
  }).join("");
  return '<div>'+filas+

    '<div class="t" style="font-weight:700">Queda</div>'+

    '</p></div>';

           'Sin detalle de cuentas para este renglón.</td></tr>';

function bgExpand(d, cod, puedeExpandir){
  var b = d.bg, det = d.detalle_bg || {};

  var pc = sum(b.pasivo), pnc = sum(b.pasivo_nc), pt = pc+pnc, pat = sum(b.patrimonio);
  function bloque(titulo, items, total, color, tag){
    var head = '<tr class="s"><td>'+titulo+'</td><td class="n">'+money(total,cod,0)+
      '</td><td class="n">'+pct(total/at,1)+'</td></tr>';

  t += '<tr class="S"><td>TOTAL ACTIVO</td><td class="n">'+money(at,cod,0)+'</td><td class="n">100,0%</td></tr>';
  t += bloque("PASIVO CORRIENTE", b.pasivo, pc, "var(--orange)", "pc");
  if(b.pasivo_nc.length) t += bloque("PASIVO NO CORRIENTE", b.pasivo_nc, pnc, "var(--orange)", "pnc");
  t += '<tr class="S"><td>TOTAL PASIVO</td><td class="n">'+money(pt,cod,0)+'</td><td class="n">'+pct(pt/at,1)+'</td></tr>';
  t += bloque("PATRIMONIO", b.patrimonio, pat, "var(--green)", "pat");

  t += '<tr class="F"><td>PASIVO + PATRIMONIO</td><td class="n">'+money(pt+pat,cod,0)+

       '</td><td></td></tr></tbody></table></div>';
  return t;
}
