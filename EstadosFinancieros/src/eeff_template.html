/* =====================================================================
   SALUD DE INVENTARIO — ABC / XYZ y los demas metodos
   Disciplina igual que en el resto del tablero:
   - La DEMANDA es un flujo: se recorta al rango elegido.
   - El STOCK es un saldo: es la foto del corte y NO existe historico de
     existencias en esta extraccion. Por eso, si el rango no termina en el
     ultimo mes, la cobertura mezcla un stock de hoy con una demanda vieja y
     la pagina lo dice en vez de disimularlo.
   - El coeficiente de variacion necesita al menos 3 meses de demanda. Con
     menos no se publica una clase XYZ: se marca como sin clasificar.
   ===================================================================== */

var INV_POL = { sobre_d: 180, riesgo_d: 30, objetivo_d: 90 };  // politica declarada en pantalla
var INVF = { abc:null, xyz:null, salud:null, cat:null, q:"", ord:"stock_val", dir:-1 };

function invPais(cod){ return ((DATA.inventario||{})[cod]) || null; }
function invMeses(cod){ var b=invPais(cod); return (b && b.meses_con_demanda) || []; }

function diasDelMes(m){
  var D=[31,28,31,30,31,30,31,31,30,31,30,31];
  var p=String(DATA.meta.corte_iso).split("-"), mc=parseInt(p[1],10), dc=parseInt(p[2],10);
  if(m===mc) return Math.max(1,dc);
  if(m>mc) return 0;
  return D[m-1];
}

function invCobertura(cod,a,b){
  // Meses de demanda que Odoo realmente cubre y que caen dentro del rango.
  var ms = invMeses(cod).filter(function(m){ return m>=a && m<=b; });
  var dias = ms.reduce(function(s,m){ return s+diasDelMes(m); },0);
  return { meses: ms, dias: dias };
}

function cv(arr){
  if(arr.length < 3) return null;
  var n=arr.length, mu=arr.reduce(function(s,x){return s+x;},0)/n;
  if(mu <= 0) return null;
  var v=arr.reduce(function(s,x){ return s+(x-mu)*(x-mu); },0)/n;
  return Math.sqrt(v)/mu;
}

function invCalc(cod,a,b){
  var B = invPais(cod); if(!B) return null;
  var cob = invCobertura(cod,a,b);
  var items = (B.items||[]).map(function(it){
    var du=0, dv=0, serie=[];
    cob.meses.forEach(function(m){
      var u=(it.u||{})[String(m)]||0, v=(it.v||{})[String(m)]||0;
      du+=u; dv+=v; serie.push(u);
    });
    var diaria = cob.dias>0 ? du/cob.dias : 0;
    var cobert = diaria>0 ? it.stock_u/diaria : null;
    var cvv = cv(serie);
    var xyz = (cvv===null) ? null : (cvv<0.5?"X":(cvv<=1.0?"Y":"Z"));
    // Un SKU sin una sola venta en el rango no es "sin clasificar": es "sin venta".
    // Mezclarlos esconde el hallazgo detras de un tecnicismo estadistico.
    var xyzk = xyz || (du<=0 ? "0" : "-");
    var salud, sev;
    if(it.stock_u<=0 && du>0){ salud="quiebre"; sev="critico"; }
    else if(it.stock_u<=0){ salud="inerte"; sev="neutro"; }
    else if(du<=0){ salud="muerto"; sev="critico"; }
    else if(cobert<INV_POL.riesgo_d){ salud="riesgo"; sev="vigilar"; }
    else if(cobert>INV_POL.sobre_d){ salud="sobre"; sev="vigilar"; }
    else { salud="sano"; sev="sano"; }
    // Capital dormido: lo muerto entero, y del sobrestock solo el exceso sobre
    // la politica de 90 dias. El resto del stock esta trabajando.
    var dormido = 0;
    if(salud==="muerto") dormido = it.stock_val;
    else if(salud==="sobre" && diaria>0)
      dormido = Math.max(0, it.stock_u - INV_POL.objetivo_d*diaria) * it.costo_u;
    return { sku:it.sku, nombre:it.nombre, cat:it.cat||"—", costo_u:it.costo_u,
             stock_u:it.stock_u, stock_val:it.stock_val, dem_u:du, dem_v:dv,
             diaria:diaria, cobertura:cobert, cv:cvv, xyz:xyz, xyzk:xyzk, salud:salud, sev:sev,
             dormido:dormido, costo_dem: du*it.costo_u };
  });
  // ABC sobre el valor de venta del rango (Pareto 80/95)
  var vivos = items.slice().sort(function(x,y){ return y.dem_v - x.dem_v; });
  var totV = vivos.reduce(function(s,x){ return s+Math.max(0,x.dem_v); },0);
  var acum = 0;
  vivos.forEach(function(x,i){
    if(x.dem_v<=0){ x.abc="C"; x.acum_pct=totV?acum/totV:0; x.rank=i+1; return; }
    acum += x.dem_v; x.acum_pct = totV ? acum/totV : 0; x.rank = i+1;
    x.abc = (x.acum_pct<=0.80) ? "A" : (x.acum_pct<=0.95 ? "B" : "C");
  });
  var conStock = items.filter(function(x){ return x.stock_u>0; });
  var totStock = items.reduce(function(s,x){ return s+x.stock_val; },0);
  var dormido = items.reduce(function(s,x){ return s+x.dormido; },0);
  var costoDem = items.reduce(function(s,x){ return s+x.costo_dem; },0);
  var rot = (totStock>0 && cob.dias>0) ? (costoDem*(365/cob.dias))/totStock : null;
  var dio = (rot && rot>0) ? 365/rot : null;
  var top10 = items.slice().sort(function(x,y){ return y.stock_val-x.stock_val; }).slice(0,10);
  var top10v = top10.reduce(function(s,x){ return s+x.stock_val; },0);
  // Cobertura ponderada por valor de stock, solo sobre lo que si rota
  var wn=0, wd=0;
  items.forEach(function(x){ if(x.cobertura!==null){ wn+=x.cobertura*x.stock_val; wd+=x.stock_val; } });
  var cats = {};
  items.forEach(function(x){ cats[x.cat]=(cats[x.cat]||0)+x.stock_val; });
  return {
    cod:cod, pais:B.pais, empresa:B.empresa, moneda:B.moneda, items:items, cob:cob,
    tot_stock:totStock, n_sku:items.length, n_con_stock:conStock.length,
    dormido:dormido, rot:rot, dio:dio, top10:top10, top10_pct: totStock? top10v/totStock : null,
    cob_pond: wd>0 ? wn/wd : null, tot_venta:totV, costo_dem:costoDem,
    conciliacion:B.conciliacion||null, podado:B.podado, n_sku_origen:B.n_sku_origen,
    cats:cats, salud:["quiebre","muerto","riesgo","sobre","sano","inerte"].map(function(k){
      var g=items.filter(function(x){ return x.salud===k; });
      return { k:k, n:g.length, val:g.reduce(function(s,x){return s+x.stock_val;},0),
               venta:g.reduce(function(s,x){return s+x.dem_v;},0) };
    })
  };
}

function SALUD_TXT(dias){
  var d = fm(dias||0,0);
  return {
  quiebre:["Quiebre con demanda","Sin existencias y con ventas en el rango: venta perdida","critico"],
  muerto: ["Sin venta en "+d+" días","Tiene stock y no facturó una sola unidad en la ventana del rango","critico"],
  riesgo: ["Riesgo de quiebre","Menos de "+INV_POL.riesgo_d+" días de cobertura","vigilar"],
  sobre:  ["Sobrestock","Más de "+INV_POL.sobre_d+" días de cobertura","vigilar"],
  sano:   ["Saludable","Entre "+INV_POL.riesgo_d+" y "+INV_POL.sobre_d+" días de cobertura","sano"],
  inerte: ["Inactivo","Sin stock y sin demanda: ficha abierta sin operación","neutro"]
  };
}
var ABC_TXT = { A:"Vital · hasta el 80% de la venta", B:"Intermedio · del 80 al 95%", C:"Marginal · el último 5%" };
var XYZ_TXT = { X:"Estable · CV < 0,5", Y:"Variable · CV 0,5 – 1,0", Z:"Errática · CV > 1,0",
  "-":"Sin clasificar · menos de 3 meses con venta", "0":"Sin venta · cero unidades en el rango" };

function sevColor(s){   // relleno de barras y leyendas
  return s==="critico" ? "var(--mk-bad)" : s==="vigilar" ? "var(--mk-warn)"
       : s==="sano" ? "var(--mk-good)" : "var(--line2)";
}
function sevTexto(s){   // texto y borde del chip: aqui manda el contraste de texto
  return s==="critico" ? "var(--red)" : s==="vigilar" ? "var(--amber)"
       : s==="sano" ? "var(--green)" : "var(--ink3)";
}
function invTip(t){ return ' data-tip="'+esc(t).replace(/"/g,"&quot;")+'"'; }

/* ---------- Matriz ABC x XYZ ---------- */
function invMatriz(R){
  var A=["A","B","C"], X=["X","Y","Z","-","0"];
  var cel = {}, maxv = 0;
  A.forEach(function(a){ X.forEach(function(x){ cel[a+x]={n:0,val:0,venta:0,dorm:0}; }); });
  R.items.forEach(function(it){
    var k = it.abc + it.xyzk; if(!cel[k]) return;
    cel[k].n++; cel[k].val += it.stock_val; cel[k].venta += it.dem_v; cel[k].dorm += it.dormido;
  });
  for(var k in cel) maxv = Math.max(maxv, cel[k].val);
  // Una columna vacia no se dibuja: ocupa ancho y no dice nada.
  // Las referencias sin ninguna venta caen todas en C por definicion: ocuparian una
  // columna con dos celdas vacias. Salen de la matriz y se declaran aparte, con su cifra.
  var sinV = {n:0,val:0,dorm:0};
  A.forEach(function(a){ var c=cel[a+"0"]; sinV.n+=c.n; sinV.val+=c.val; sinV.dorm+=c.dorm; });
  maxv = 0;
  for(var k2 in cel) if(k2.slice(-1)!=="0") maxv = Math.max(maxv, cel[k2].val);
  var cols = ["X","Y","Z","-"].filter(function(x){ return A.some(function(a){ return cel[a+x].n>0; }); });
  var ROT = { X:["X","CV &lt; 0,5"], Y:["Y","CV 0,5 – 1,0"], Z:["Z","CV &gt; 1,0"],
              "-":["s/c","menos de 3 meses con venta"], "0":["Sin venta","cero unidades en el rango"] };
  var head = '<tr><th style="width:96px"></th>'+cols.map(function(x){
    return '<th style="text-align:center">'+ROT[x][0]+
      '<span class="sub2" style="font-weight:400;text-align:center">'+ROT[x][1]+'</span></th>'; }).join("")+'</tr>';
  var ABC_SUB = { A:"hasta el 80% de la venta", B:"del 80 al 95%", C:"el último 5%" };
  var filas = A.map(function(a){
    return '<tr><th style="text-align:left;border:0;padding-top:6px;text-transform:none">'+
      '<span style="font-size:14px">'+a+'</span>'+
      '<span class="sub2" style="font-weight:400">'+ABC_SUB[a]+'</span></th>'+
      cols.map(function(x){
        var c=cel[a+x], paso = (maxv>0 && c.val>0) ? Math.min(5,Math.max(1,Math.ceil(c.val/maxv*5))) : 0;
        var sel = (INVF.abc===a && INVF.xyz===x);
        var tip = a+" · "+ROT[x][0]+" — "+c.n+" referencias · "+kM(c.val,R.cod)+" en stock · "+
                  kM(c.venta,R.cod)+" vendidos en el rango"+
                  (c.dorm>0 ? " · "+kM(c.dorm,R.cod)+" dormidos" : "");
        return '<td class="hm'+(paso?" i"+paso:" i0")+(sel?" sel":"")+'" data-a="'+a+'" data-x="'+x+'"'+
          invTip(tip)+'><b>'+c.n+'</b><span>'+kM(c.val,R.cod)+'</span></td>';
      }).join("")+'</tr>';
  }).join("");
  var leyenda = '<div class="leg" style="margin-top:10px"><span style="color:var(--ink3)">Capital en stock</span>'+
    [1,2,3,4,5].map(function(i){ return '<span><b class="sw i'+i+'"></b></span>'; }).join("")+
    '<span style="color:var(--ink3)">menos → más</span></div>';
  var aparte = sinV.n ? '<div class="hueco" style="border-color:var(--line2);background:var(--panel2);margin:12px 0 0">'+
      '<b style="color:var(--ink2)">Fuera de la matriz: '+sinV.n+' referencias sin venta</b>'+
      'Suman '+kM(sinV.val,R.cod)+' en stock. No tienen clase ABC ni XYZ porque no vendieron una sola unidad '+
      'en la ventana del rango; en la tabla de abajo aparecen como «sin venta».'+
      '</div>' : "";
  return '<div class="scroll"><table class="hmt">'+head+filas+'</table></div>'+leyenda+aparte+
    '<p class="cap" style="margin:10px 0 0">Cada celda dice cuántas referencias y cuánto capital. '+
    'Tocá una para filtrar la tabla de abajo. '+
    (cols.indexOf("X")>=0
      ? 'A·X es lo que nunca debe faltar; C·Z con stock es lo primero que hay que liquidar.'
      : 'Ninguna referencia llega a clase X: no hay demanda estable que permita reponer con regla fija.')+
    '</p>';
}

/* ---------- Curva de Pareto ---------- */
function invPareto(R){
  var L = R.items.filter(function(x){ return x.dem_v>0; }).sort(function(x,y){ return y.dem_v-x.dem_v; });
  if(!L.length) return '<p class="cap">Sin ventas en el rango: la curva de Pareto no se puede trazar.</p>';
  var n = L.length, maxv = L[0].dem_v, W = 760, H = 150;
  var bw = Math.max(1, W/n), barras = "", linea = "";
  var acum = 0, tot = L.reduce(function(s,x){ return s+x.dem_v; },0);
  var pts = [];
  L.forEach(function(x,i){
    var h = Math.max(1, x.dem_v/maxv*H);
    barras += '<rect x="'+(i*bw).toFixed(2)+'" y="'+(H-h).toFixed(2)+'" width="'+Math.max(0.6,bw-0.6).toFixed(2)+
      '" height="'+h.toFixed(2)+'" rx="'+(bw>4?1.5:0)+'" fill="'+(x.abc==="A"?"var(--i5)":x.abc==="B"?"var(--i3)":"var(--i1)")+'"></rect>';
    acum += x.dem_v;
    pts.push([(i*bw+bw/2).toFixed(2), (H - acum/tot*H).toFixed(2)]);
  });
  linea = '<polyline fill="none" stroke="var(--mk-warn)" stroke-width="2" points="'+
    pts.map(function(p){ return p.join(","); }).join(" ")+'"></polyline>';
  var y80 = H - 0.80*H, y95 = H - 0.95*H;
  var nA = L.filter(function(x){return x.abc==="A";}).length,
      nB = L.filter(function(x){return x.abc==="B";}).length;
  var ejes = '<line x1="0" y1="'+y80.toFixed(1)+'" x2="'+W+'" y2="'+y80.toFixed(1)+
      '" stroke="var(--line2)" stroke-width="1" stroke-dasharray="3 3"></line>'+
    '<text x="'+(W-4)+'" y="'+(y80-4).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--ink3)">80% de la venta</text>'+
    '<line x1="0" y1="'+y95.toFixed(1)+'" x2="'+W+'" y2="'+y95.toFixed(1)+
      '" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>';
  var marcaA = nA ? '<line x1="'+(nA*bw).toFixed(1)+'" y1="0" x2="'+(nA*bw).toFixed(1)+'" y2="'+H+
      '" stroke="var(--line2)" stroke-width="1"></line>'+
    '<text x="'+(nA*bw+4).toFixed(1)+'" y="12" font-size="10" fill="var(--ink3)">'+nA+' SKU = clase A</text>' : "";
  return '<div class="scroll"><svg viewBox="0 0 '+W+' '+(H+18)+'" width="100%" height="168" '+
    'preserveAspectRatio="none" role="img" aria-label="Curva de Pareto de la venta por SKU">'+
    barras+ejes+marcaA+linea+'</svg></div>'+
    '<div class="leg"><span><b style="background:var(--i5)"></b>Clase A ('+nA+')</span>'+
    '<span><b style="background:var(--i3)"></b>Clase B ('+nB+')</span>'+
    '<span><b style="background:var(--i1)"></b>Clase C ('+(L.length-nA-nB)+')</span>'+
    '<span><b style="background:var(--mk-warn)"></b>Venta acumulada</span></div>'+
    '<p class="cap" style="margin-top:8px">'+nA+' de '+R.n_sku+' referencias ('+
    pct(nA/R.n_sku,0)+' del catálogo) explican el 80% de la venta del rango.</p>';
}

/* ---------- Distribucion de salud ---------- */
function invSalud(R){
  var tot = R.tot_stock||1, maxn = Math.max.apply(null, R.salud.map(function(x){return x.val;}).concat([1]));
  var TX = SALUD_TXT(R.cob.dias);
  var filas = R.salud.filter(function(g){ return g.n>0; }).map(function(g){
    var t = TX[g.k], sel = (INVF.salud===g.k);
    return '<tr class="sl'+(sel?" sel":"")+'" data-s="'+g.k+'"'+
      invTip(t[1])+'><td style="width:38%">'+
      '<span class="sem" style="--c:'+sevTexto(t[2])+'">'+esc(t[0])+'</span>'+
      '<div class="sub2">'+esc(t[1])+'</div></td>'+
      '<td class="n">'+g.n+'<span class="sub2" style="text-align:right">SKU</span></td>'+
      '<td style="width:34%"><div class="bar"><i style="width:'+
        (g.val/maxn*100).toFixed(1)+'%;background:'+sevColor(t[2])+'"></i></div></td>'+
      '<td class="n">'+kM(g.val,R.cod)+'<span class="sub2" style="text-align:right">'+
        pct(g.val/tot,0)+' del stock</span></td>'+
      '<td class="n">'+kM(g.venta,R.cod)+'</td></tr>';
  }).join("");
  return '<div class="scroll"><table style="min-width:620px">'+
    '<tr><th>Clase de salud</th><th>SKU</th><th>Capital en stock</th><th>Valor</th>'+
    '<th>Venta del rango</th></tr>'+
    filas+'</table></div><p class="cap" style="margin-top:10px">Tocá una fila para filtrar la tabla. '+
    'La cobertura compara el stock de hoy contra la demanda diaria del rango. '+
    'Las referencias en quiebre no tienen capital en stock —ese es el problema—: lo que miden es la venta que se hizo antes de quedarse sin existencias.</p>';
}

/* ---------- Tabla de SKU ---------- */
function invFiltra(R){
  var q = INVF.q.toLowerCase();
  return R.items.filter(function(x){
    if(INVF.abc && x.abc!==INVF.abc) return false;
    if(INVF.xyz && x.xyzk!==INVF.xyz) return false;
    if(INVF.salud && x.salud!==INVF.salud) return false;
    if(INVF.cat && x.cat!==INVF.cat) return false;
    if(q && (x.sku+" "+x.nombre).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
var INV_COLS = [
  ["sku","SKU",0],["nombre","Descripción",0],["abc","ABC",1],["xyz","XYZ",1],
  ["stock_u","Stock u",1],["stock_val","Valor stock",1],["dem_u","Dem. u",1],
  ["cobertura","Cobertura d",1],["dormido","Dormido",1],["salud","Salud",0]
];
function invTabla(R){
  var L = invFiltra(R).slice().sort(function(x,y){
    var a=x[INVF.ord], b=y[INVF.ord];
    if(a===null||a===undefined) a = INVF.dir<0 ? -Infinity : Infinity;
    if(b===null||b===undefined) b = INVF.dir<0 ? -Infinity : Infinity;
    if(typeof a==="string") return INVF.dir*a.localeCompare(b);
    return INVF.dir*(a-b);
  });
  var vis = L.slice(0,120);
  var head = '<colgroup><col style="width:88px"><col><col style="width:54px"><col style="width:74px">'+
    '<col style="width:76px"><col style="width:112px"><col style="width:72px"><col style="width:96px">'+
    '<col style="width:104px"><col style="width:132px"></colgroup>'+
    '<tr>'+INV_COLS.map(function(c){
    var on = INVF.ord===c[0];
    return '<th class="so'+(on?" on":"")+'" data-o="'+c[0]+'" style="cursor:pointer;'+
      (c[2]?"text-align:right":"text-align:left")+'">'+esc(c[1])+
      (on ? (INVF.dir<0?" ▾":" ▴") : "")+'</th>'; }).join("")+'</tr>';
  var TX = SALUD_TXT(R.cob.dias), ROTC = {X:"X",Y:"Y",Z:"Z","-":"s/c","0":"sin venta"};
  var filas = vis.map(function(x){
    var t = TX[x.salud];
    return '<tr><td><span class="cod">'+esc(x.sku)+'</span></td>'+
      '<td style="font-size:12px">'+esc(x.nombre.length>52?x.nombre.slice(0,52)+"…":x.nombre)+
        '<div class="sub2">'+esc(x.cat)+'</div></td>'+
      '<td class="n"><span class="chip">'+x.abc+'</span></td>'+
      '<td class="n"><span class="chip">'+ROTC[x.xyzk]+'</span>'+
        (x.cv!==null?'<div class="sub2" style="text-align:right">CV '+x.cv.toFixed(2)+'</div>':'')+'</td>'+
      '<td class="n">'+fm(x.stock_u,0)+'</td>'+
      '<td class="n">'+money(x.stock_val,R.cod,0)+'</td>'+
      '<td class="n">'+fm(x.dem_u,0)+'</td>'+
      '<td class="n">'+(x.cobertura===null?"—":(x.cobertura>999?"&gt;999":fm(x.cobertura,0)))+'</td>'+
      '<td class="n">'+(x.dormido>0?money(x.dormido,R.cod,0):"—")+'</td>'+
      '<td><span class="sem" style="--c:'+sevTexto(t[2])+'">'+esc(t[0])+'</span></td></tr>';
  }).join("");
  var cats = Object.keys(R.cats).sort();
  var chips = [];
  if(INVF.abc) chips.push(["abc","Clase "+INVF.abc]);
  if(INVF.xyz) chips.push(["xyz", INVF.xyz==="-" ? "XYZ sin clasificar"
      : (INVF.xyz==="0" ? "Sin venta en el rango" : "XYZ "+INVF.xyz)]);
  if(INVF.salud) chips.push(["salud",TX[INVF.salud][0]]);
  if(INVF.cat) chips.push(["cat",INVF.cat]);
  var barra = '<div class="rgrp" style="margin-bottom:10px;gap:8px">'+
    '<input class="inpq" id="invQ" type="search" placeholder="Buscar SKU o descripción" value="'+esc(INVF.q)+'">'+
    '<select id="invCat"><option value="">Todas las categorías</option>'+
      cats.map(function(c){ return '<option value="'+esc(c)+'"'+(INVF.cat===c?" selected":"")+'>'+esc(c)+'</option>'; }).join("")+
    '</select>'+
    chips.map(function(c){ return '<button class="pre xf" data-f="'+c[0]+'" aria-pressed="true">'+esc(c[1])+' ✕</button>'; }).join("")+
    (chips.length||INVF.q ? '<button class="pre" id="invClr">Limpiar todo</button>' : '')+
    '<span style="font-size:11.5px;color:var(--ink3);margin-left:auto">'+L.length+' de '+R.n_sku+' referencias'+
      (L.length>120 ? " · se muestran las 120 primeras" : "")+'</span></div>';
  return barra+'<div class="scroll"><table class="tsku">'+head+filas+'</table></div>';
}

/* ---------- Conciliacion y metodo ---------- */
function invConc(R){
  var c = R.conciliacion;
  if(!c || c.balance_almacen===null || c.balance_almacen===undefined)
    return '<p class="cap">'+esc(R.pais)+' no mantiene inventario propio en el balance: no hay nada que conciliar.</p>';
  var crit = Math.abs(c.pct||0) > 0.02;
  return '<table><tr><th>Concepto</th><th>Valor</th></tr>'+
    '<tr><td>Maestro de productos a costo estándar'+
      '<div class="sub2">Suma de existencias × costo unitario, producto por producto</div></td>'+
      '<td class="n">'+money(c.maestro,R.cod,0)+'</td></tr>'+
    '<tr><td>Inventario en almacén según el balance</td><td class="n">'+money(c.balance_almacen,R.cod,0)+'</td></tr>'+
    '<tr class="S"><td>Diferencia '+sem(crit?"critico":"sano")+'</td><td class="n">'+
      money(c.dif,R.cod,0)+' ('+pct(c.pct,1)+')</td></tr></table>'+
    '<p class="cap" style="margin-top:10px">'+(crit
      ? 'La diferencia pasa del 2%: el costo estándar del maestro y el costo contabilizado no son el mismo número. '+
        'Mientras no se cierre, el valor por SKU sirve para ordenar prioridades, no para valorar el inventario.'
      : 'La diferencia está por debajo del 2%: el maestro y el balance cuentan lo mismo.')+'</p>';
}

function invMetodo(R){
  var L = [];
  L.push("<b>Qué se midió.</b> "+R.n_sku+" referencias"+(R.podado?" (de "+R.n_sku_origen+"; se dejaron las que tienen stock o movimiento)":"")+
    ", "+R.n_con_stock+" con existencias. Fuente: existencias de Odoo en el contexto de "+esc(R.empresa)+
    " y las líneas de factura del rango.");
  L.push("<b>Stock y demanda no son del mismo momento.</b> El stock es la foto del "+esc(DATA.meta.corte)+
    "; la demanda se recorta al rango. No hay histórico de existencias en esta extracción, así que la cobertura "+
    "de un rango que no termina en el último mes compara un stock de hoy con una demanda vieja.");
  L.push("<b>ABC.</b> Pareto sobre el valor vendido del rango: A hasta el 80% acumulado, B hasta el 95%, C el resto. "+
    "Una referencia sin venta en el rango cae en C y se separa aparte por su clase de salud.");
  L.push("<b>XYZ.</b> Coeficiente de variación de la demanda mensual en unidades (X &lt; 0,5 · Y 0,5–1,0 · Z &gt; 1,0). "+
    "Con menos de 3 meses de demanda no se publica clase: queda «sin clasificar». "+
    "Este rango trae "+R.cob.meses.length+" mes"+(R.cob.meses.length===1?"":"es")+" de demanda"+
    (R.cob.meses.length<3 ? " — por debajo del mínimo, así que el XYZ de esta vista no es concluyente." : "."));
  L.push("<b>Cobertura.</b> Existencias ÷ demanda diaria del rango ("+fm(R.cob.dias,0)+" días calendario). "+
    "Política declarada: menos de "+INV_POL.riesgo_d+" días es riesgo, más de "+INV_POL.sobre_d+" días es sobrestock.");
  L.push("<b>Capital dormido.</b> El valor íntegro de lo que tiene stock y cero ventas, más el exceso del sobrestock "+
    "sobre "+INV_POL.objetivo_d+" días de cobertura. El objetivo de "+INV_POL.objetivo_d+" días es una política, no un dato: cámbiela y el número cambia.");
  L.push("<b>Rotación.</b> Costo de la demanda del rango anualizado ÷ inventario a costo. No usa el costo de ventas "+
    "contable: ese entra por ajustes periódicos y no se puede repartir por SKU.");
  L.push("<b>Las ventas son netas de notas de crédito.</b> Por eso una clase puede mostrar venta negativa: "+
    "devoluciones de un período anterior registradas dentro del rango, sin unidades vendidas que las compensen.");
  L.push("<b>Valoración.</b> Costo estándar del maestro de productos. La conciliación de arriba dice cuánto se aparta del balance.");
  return '<ul class="metodo">'+L.map(function(x){ return '<li>'+x+'</li>'; }).join("")+'</ul>';
}

/* ---------- Hallazgos ---------- */
function invHallazgos(R){
  var N = [], tot = R.tot_stock||1;
  var muerto = R.salud.filter(function(g){return g.k==="muerto";})[0] || {n:0,val:0};
  var quiebre = R.salud.filter(function(g){return g.k==="quiebre";})[0] || {n:0,val:0,venta:0};
  var sobre = R.salud.filter(function(g){return g.k==="sobre";})[0] || {n:0,val:0};
  if(R.dormido/tot > 0.15)
    N.push(["crit","Capital dormido por "+kM(R.dormido,R.cod),
      "Es el "+pct(R.dormido/tot,0)+" del inventario a costo. "+muerto.n+" referencias no facturaron "+
      "una sola unidad en los "+fm(R.cob.dias,0)+" días de la ventana y valen "+kM(muerto.val,R.cod)+
      "; el resto es el exceso del sobrestock sobre "+INV_POL.objetivo_d+" días. "+
      "Esa plata ya se pagó al proveedor y no vuelve hasta que se venda o se liquide."]);
  if(quiebre.n)
    N.push(["crit",quiebre.n+" referencias en quiebre con demanda activa",
      "Vendieron "+kM(quiebre.venta,R.cod)+" en el rango y hoy están en cero. "+
      "El quiebre no aparece en ningún estado financiero: la venta que no se hizo no se contabiliza."]);
  if(R.dio && R.dio>150)
    N.push(["warn","El inventario tarda "+fm(R.dio,0)+" días en rotar",
      "Rotación de "+(R.rot?R.rot.toFixed(2):"—")+" veces al año medida contra la demanda del rango. "+
      "Cada día de inventario es caja inmovilizada: bajar 30 días libera del orden de "+
      kM(R.tot_stock*30/Math.max(1,R.dio),R.cod)+"."]);
  if(R.top10_pct && R.top10_pct>0.5)
    N.push(["warn","10 referencias concentran el "+pct(R.top10_pct,0)+" del inventario",
      "La gestión de esas diez decide el capital de trabajo del negocio. "+
      "Un error de compra ahí pesa más que cualquier ahorro en el resto del catálogo."]);
  if(sobre.n)
    N.push(["info",sobre.n+" referencias con más de "+INV_POL.sobre_d+" días de cobertura",
      "Valen "+kM(sobre.val,R.cod)+". No es stock perdido, pero es la primera fuente de caja: "+
      "frenar la recompra de estas antes de pedir financiamiento."]);
  var conX = R.items.filter(function(x){ return x.xyz==="X"; }).length;
  var conClase = R.items.filter(function(x){ return x.xyz; }).length;
  if(conClase >= 5 && conX === 0)
    N.push(["warn","Ninguna referencia tiene demanda estable",
      "De "+conClase+" referencias clasificables, ninguna baja de 0,5 de coeficiente de variación. "+
      "Con esa dispersión no se repone con punto de pedido fijo: o se compra contra pronóstico y se "+
      "asume el error, o se negocian plazos de entrega más cortos con el proveedor."]);
  var nc = R.items.filter(function(x){ return x.xyzk==="-"; }).length;
  if(nc)
    N.push(["info",nc+" referencias sin clase XYZ",
      "Vendieron algo, pero en menos de 3 meses distintos, y el coeficiente de variación necesita 3. "+
      "Antes de estimar una clase, se declara el hueco. Las referencias sin ninguna venta van en su propia columna."]);
  if(!N.length) return "";
  return '<ul class="notes">'+N.map(function(x){
    return '<li class="'+x[0]+'"><b>'+esc(x[1])+'</b>'+esc(x[2])+'</li>'; }).join("")+'</ul>';
}

/* ---------- Grupo ---------- */
function invGrupo(){
  var codes = Object.keys(DATA.inventario||{}).filter(function(k){ return k!=="meta"; });
  var R = codes.map(function(k){ return invCalc(k,RA,RB); }).filter(Boolean);
  if(!R.length) return '<div class="hueco"><b>Sin datos de inventario</b>No hay extracción para ninguna compañía.</div>';
  var tc = TC();
  function usdv(v,cod){ return cod==="CO" ? v*tc : v; }
  var tot  = R.reduce(function(s,x){ return s+usdv(x.tot_stock,x.cod); },0);
  var dorm = R.reduce(function(s,x){ return s+usdv(x.dormido,x.cod); },0);
  // La rotacion del grupo NO puede anualizar con una sola ventana: cada compania tiene
  // la suya (Odoo arranco en meses distintos). Se anualiza pais por pais y despues se suma.
  var cogsAnual = R.reduce(function(s,x){
    return s + (x.cob.dias>0 ? usdv(x.costo_dem,x.cod)*(365/x.cob.dias) : 0); },0);
  var rotG = tot>0 ? cogsAnual/tot : null;
  var ventanas = R.filter(function(x){ return x.cob.dias>0; })
                  .map(function(x){ return x.pais+" "+fm(x.cob.dias,0)+" d"; }).join(" · ");
  var peor = R.filter(function(x){ return x.tot_stock>0; })
              .sort(function(a,b){ return (b.dormido/b.tot_stock)-(a.dormido/a.tot_stock); })[0];

  var h = "";
  if(peor) h += '<div class="card vd"><h2>Lectura en 30 segundos</h2><p>'+
    'El grupo tiene US$ '+fm(tot,0)+' en inventario a costo y US$ '+fm(dorm,0)+' de eso ('+
    pct(dorm/tot,0)+') no está trabajando. '+esc(peor.pais)+' concentra el problema: '+
    pct(peor.dormido/peor.tot_stock,0)+' de su inventario está dormido y tarda '+
    (peor.dio?fm(peor.dio,0):"—")+' días en rotar. Liberar esa caja no exige vender más: exige dejar de comprar lo que ya sobra.'+
    '</p></div>';
  h += '<div class="kpis">'+
    kpi("Inventario del grupo","US$ "+fm(tot,0),"a costo · "+R.length+" compañías a la TRM de presentación")+
    kpi("Capital dormido","US$ "+fm(dorm,0), (tot?pct(dorm/tot,0)+" del inventario":"—"),
        (dorm/(tot||1))>0.15?"neg":"warn")+
    kpi("Días de inventario", rotG?fm(365/rotG,0)+" d":"—",
        rotG?"rotación "+rotG.toFixed(2)+"× al año · anualizada por compañía":"")+
    kpi("Referencias con stock", String(R.reduce(function(s,x){return s+x.n_con_stock;},0)),
        "de "+R.reduce(function(s,x){return s+x.n_sku;},0)+" fichas con stock o movimiento")+
  '</div>';

  // Barra por compania: lo que trabaja contra lo que duerme. Separadas por 2px de fondo.
  var maxi = Math.max.apply(null, R.map(function(x){ return usdv(x.tot_stock,x.cod); }).concat([1]));
  var barras = R.filter(function(x){ return x.tot_stock>0; }).map(function(x){
    var t = usdv(x.tot_stock,x.cod), d = usdv(x.dormido,x.cod), w = t/maxi*100;
    return '<div class="wf"><div class="t">'+esc(x.pais)+'</div><div class="track" style="height:20px">'+
      '<i style="left:0;width:'+((t-d)/maxi*100).toFixed(2)+'%;background:var(--mk-good)"></i>'+
      '<i style="left:'+((t-d)/maxi*100).toFixed(2)+'%;width:'+Math.max(0,(d/maxi*100)).toFixed(2)+
        '%;background:var(--mk-bad);border-left:2px solid var(--panel)"></i>'+
      '</div><div class="v">US$ '+fm(t,0)+'</div></div>';
  }).join("");

  var filas = R.map(function(x){
    var sa = x.salud.filter(function(g){return g.k==="sano";})[0]||{val:0};
    return '<tr><td>'+esc(x.pais)+'<div class="sub2">'+esc(x.empresa)+'</div></td>'+
      '<td class="n">'+x.n_con_stock+'</td>'+
      '<td class="n">US$ '+fm(usdv(x.tot_stock,x.cod),0)+'</td>'+
      '<td class="n">'+(tot?pct(usdv(x.tot_stock,x.cod)/tot,0):"—")+'</td>'+
      '<td class="n">US$ '+fm(usdv(x.dormido,x.cod),0)+'</td>'+
      '<td class="n">'+(x.tot_stock?pct(x.dormido/x.tot_stock,0):"—")+'</td>'+
      '<td class="n">'+(x.dio?fm(x.dio,0)+" d":"—")+'</td>'+
      '<td class="n">'+(x.tot_stock?pct(sa.val/x.tot_stock,0):"—")+'</td>'+
      '<td class="n">'+(x.cob.dias?fm(x.cob.dias,0)+" d":"—")+'</td></tr>';
  }).join("");

  h += '<div class="card"><h2>Inventario que trabaja y inventario dormido</h2>'+
    '<p class="cap">En dólares a la TRM del '+esc(DATA.meta.trm_fecha)+'. Es presentación, no consolidación.</p>'+
    barras+
    '<div class="leg" style="margin-top:8px"><span><b style="background:var(--mk-good)"></b>En rotación</span>'+
    '<span><b style="background:var(--mk-bad)"></b>Dormido: sin venta en la ventana, más el exceso sobre '+
      INV_POL.objetivo_d+' días</span></div></div>';

  h += '<div class="card"><h2>Inventario por compañía</h2>'+
    '<p class="cap">Cada compañía se mide contra su propia ventana de demanda: Odoo arrancó en meses distintos '+
    'en cada país, y anualizar todo con la misma ventana inventa rotación.</p><div class="scroll"><table style="min-width:860px">'+
    '<tr><th>Compañía</th><th>SKU c/stock</th><th>Inventario</th><th>% grupo</th>'+
    '<th>Dormido</th><th>% dormido</th><th>Días inv.</th><th>% saludable</th><th>Ventana</th></tr>'+
    filas+'</table></div>'+
    (ventanas ? '<p class="cap" style="margin-top:10px">Ventanas de demanda: '+esc(ventanas)+
      '. Comparar el «% dormido» entre países con ventanas distintas exagera la diferencia: '+
      'cuanto más corta la ventana, más referencias aparecen sin venta.</p>' : "")+
    '</div>';
  return h;
}

/* ---------- Render de la seccion ---------- */
function renderInv(cod){
  if(cod==="GR") return invGrupo();
  var R = invCalc(cod,RA,RB);
  if(!R) return '<div class="hueco"><b>Sin datos de inventario</b>No hay extracción de inventario para este país.</div>';
  var sinMeses = !R.cob.meses.length;

  /* --- Compania que no mantiene inventario propio: la pantalla cambia de pregunta.
         No tiene sentido una matriz de cobertura sobre cero existencias; lo que si
         tiene sentido es contra que referencias factura y donde esta el riesgo. --- */
  if(R.n_con_stock === 0){
    var h0 = '<div class="card vd"><h2>Lectura en 30 segundos</h2><p>'+esc(R.empresa)+
      ' no mantiene inventario propio: '+R.n_sku+' fichas de producto, ninguna con existencias, y '+
      kM(R.tot_venta,cod)+' facturados en el rango. Opera contra el stock de otra compañía del grupo, '+
      'así que su riesgo de inventario no está en su balance sino en el de quien le despacha, '+
      'y su riesgo real es de abastecimiento: si el despachador se queda sin stock, aquí no hay colchón.</p></div>';
    var topv = R.items.slice().sort(function(a,b){ return b.dem_v-a.dem_v; }).filter(function(x){ return x.dem_v>0; });
    var c3 = topv.slice(0,3).reduce(function(s2,x){ return s2+x.dem_v; },0);
    h0 += '<div class="kpis">'+
      kpi("Facturado en el rango", kM(R.tot_venta,cod), esc(rangoTexto())+" · "+fm(R.cob.dias,0)+" días")+
      kpi("Referencias facturadas", String(topv.length), "de "+R.n_sku+" fichas abiertas")+
      kpi("Concentración top 3", R.tot_venta?pct(c3/R.tot_venta,0):"—",
          "3 referencias sobre "+topv.length, (c3/(R.tot_venta||1))>0.6?"warn":"")+
      kpi("Inventario propio", money(0,cod,0), "no hay existencias que financiar", "pos")+
    '</div>';
    h0 += '<div class="card"><h2>Concentración de la venta</h2>'+
      '<p class="cap">Venta del rango por referencia, ordenada de mayor a menor</p>'+invPareto(R)+'</div>';
    h0 += '<div class="card"><h2>Referencias facturadas</h2>'+
      '<p class="cap">Sin columnas de stock: no hay existencias propias que medir</p>'+
      '<div class="scroll"><table style="min-width:620px"><tr><th style="width:96px">SKU</th>'+
      '<th style="text-align:left">Descripción</th>'+
      '<th style="width:60px">ABC</th><th style="width:90px">Unidades</th>'+
      '<th style="width:130px">Venta del rango</th></tr>'+
      topv.map(function(x){
        return '<tr><td><span class="cod">'+esc(x.sku)+'</span></td>'+
          '<td style="font-size:12px">'+esc(x.nombre)+'<div class="sub2">'+esc(x.cat)+'</div></td>'+
          '<td class="n"><span class="chip">'+x.abc+'</span></td>'+
          '<td class="n">'+fm(x.dem_u,0)+'</td>'+
          '<td class="n">'+money(x.dem_v,cod,0)+'</td></tr>'; }).join("")+
      '</table></div></div>';
    h0 += '<div class="card"><h2>Método y supuestos</h2>'+
      '<p class="cap">Lo que hay detrás de cada número de esta pantalla</p>'+invMetodo(R)+'</div>';
    return h0;
  }

  var h = "";
  if(sinMeses)
    h += '<div class="hueco"><b>El rango no toca ningún mes con demanda</b>Odoo tiene facturas de '+
      esc(R.pais)+' en '+invMeses(cod).map(function(m){ return DATA.serie.meses[m-1]; }).join(", ")+
      '. Sin demanda en el rango no hay cobertura, ni ABC, ni XYZ: solo el valor del stock.</div>';
  else if(R.cob.dias < INV_POL.sobre_d)
    h += '<div class="hueco"><b>La ventana de demanda es corta: '+fm(R.cob.dias,0)+' días</b>'+
      'Odoo solo tiene facturas de '+esc(R.pais)+' desde '+esc(DATA.serie.meses[R.cob.meses[0]-1])+
      '. Con esa ventana, «sin venta» quiere decir que no facturó en '+fm(R.cob.dias,0)+' días, no que esté muerto, '+
      'y una cobertura de más de '+INV_POL.sobre_d+' días se extrapola desde menos de '+INV_POL.sobre_d+
      ' días observados. Se publica igual porque es lo que hay, pero la clase de salud de '+esc(R.pais)+
      ' se lee como señal de prioridad, no como veredicto.</div>';
  else if(RB < (DATA.serie.meses||[]).length)
    h += '<div class="hueco"><b>El stock es de hoy, la demanda es del rango</b>'+
      'Las existencias son la foto del '+esc(DATA.meta.corte)+' porque la extracción no guarda histórico de stock. '+
      'La cobertura de un rango que no termina en el último mes compara dos momentos distintos. '+
      'Para leerla sin ruido, usá «Año a la fecha».</div>';

  var muerto = R.salud.filter(function(g){return g.k==="muerto";})[0]||{n:0,val:0};
  h += '<div class="card vd"><h2>Lectura en 30 segundos</h2><p>'+
    esc(R.empresa)+' tiene '+kM(R.tot_stock,cod)+' en inventario a costo repartido en '+R.n_con_stock+
    ' referencias. '+kM(R.dormido,cod)+' ('+pct(R.dormido/R.tot_stock,0)+') es capital dormido: '+
    muerto.n+' referencias que no facturaron una sola unidad en los '+fm(R.cob.dias,0)+
    ' días de la ventana, más el exceso del sobrestock sobre '+INV_POL.objetivo_d+' días. '+
    'El inventario rota '+(R.rot?R.rot.toFixed(2):"—")+' veces al año, es decir '+(R.dio?fm(R.dio,0):"—")+
    ' días de existencias.</p></div>';

  var sa = R.salud.filter(function(g){return g.k==="sano";})[0]||{val:0};
  h += '<div class="kpis">'+
    kpi("Inventario a costo", kM(R.tot_stock,cod), R.n_con_stock+" de "+R.n_sku+" referencias con stock")+
    kpi("Capital dormido", kM(R.dormido,cod),
        (R.tot_stock?pct(R.dormido/R.tot_stock,0)+" del inventario":"—")+
          " · ventana de "+fm(R.cob.dias,0)+" días",
        (R.dormido/(R.tot_stock||1))>0.15?"neg":"warn")+
    kpi("Días de inventario", R.dio?fm(R.dio,0)+" d":"—",
        R.rot?"rotación "+R.rot.toFixed(2)+"× al año":"sin demanda en el rango",
        (R.dio||0)>180?"neg":((R.dio||0)>120?"warn":"pos"))+
    kpi("Cobertura ponderada", R.cob_pond?fm(Math.min(R.cob_pond,9999),0)+" d":"—",
        "promedio pesado por valor de stock")+
    kpi("Stock saludable", R.tot_stock?pct(sa.val/R.tot_stock,0):"—",
        "entre "+INV_POL.riesgo_d+" y "+INV_POL.sobre_d+" días de cobertura",
        (sa.val/(R.tot_stock||1))>0.5?"pos":"warn")+
    kpi("Concentración top 10", R.top10_pct?pct(R.top10_pct,0):"—",
        "10 referencias sobre "+R.n_sku, (R.top10_pct||0)>0.5?"warn":"")+
  '</div>';
  h += '<div class="grid2">'+
    '<div class="card"><h2>Matriz ABC × XYZ</h2><p class="cap">Valor de venta del rango contra estabilidad de la demanda · '+
      R.cob.meses.length+' meses con venta, '+fm(R.cob.dias,0)+' días</p>'+invMatriz(R)+'</div>'+
    '<div class="card"><h2>Curva de Pareto</h2><p class="cap">Venta del rango por referencia, ordenada de mayor a menor</p>'+
      invPareto(R)+'</div>'+
  '</div>';
  h += '<div class="card"><h2>Salud del inventario</h2>'+
    '<p class="cap">Clasificación por cobertura y movimiento. Cada clase lleva su etiqueta: el color acompaña, no informa solo.</p>'+
    invSalud(R)+'</div>';
  h += '<div class="card"><h2>Referencias</h2><p class="cap">Filtrada por la matriz y por la tabla de salud · '+
    'tocá un encabezado para ordenar</p>'+invTabla(R)+'</div>';
  var hall = invHallazgos(R);
  if(hall) h += '<div class="secth">Hallazgos</div>'+hall;
  h += '<div class="grid2">'+
    '<div class="card"><h2>Conciliación contra el balance</h2>'+
      '<p class="cap">El maestro de productos no es el libro mayor: la diferencia se mide, no se asume</p>'+invConc(R)+'</div>'+
    '<div class="card"><h2>Método y supuestos</h2><p class="cap">Lo que hay detrás de cada número de esta pantalla</p>'+
      invMetodo(R)+'</div>'+
  '</div>';
  return h;
}

function enganchaInv(){
  var el = document.getElementById("panel");
  el.querySelectorAll(".hm").forEach(function(c){
    c.addEventListener("click", function(){
      var a=c.dataset.a, x=c.dataset.x;
      if(INVF.abc===a && INVF.xyz===x){ INVF.abc=null; INVF.xyz=null; }
      else { INVF.abc=a; INVF.xyz=x; }
      render(tabActivo());
    });
  });
  el.querySelectorAll("tr.sl").forEach(function(r){
    r.style.cursor="pointer";
    r.addEventListener("click", function(){
      INVF.salud = (INVF.salud===r.dataset.s) ? null : r.dataset.s;
      render(tabActivo());
    });
  });
  el.querySelectorAll("th.so").forEach(function(t){
    t.addEventListener("click", function(){
      var o=t.dataset.o;
      if(INVF.ord===o) INVF.dir = -INVF.dir;
      else { INVF.ord=o; INVF.dir = (o==="sku"||o==="nombre"||o==="abc"||o==="xyz"||o==="salud") ? 1 : -1; }
      render(tabActivo());
    });
  });
  el.querySelectorAll(".xf").forEach(function(b){
    b.addEventListener("click", function(){
      if(b.dataset.f==="abc"){ INVF.abc=null; INVF.xyz=null; } else INVF[b.dataset.f]=null;
      render(tabActivo());
    });
  });
  var clr = document.getElementById("invClr");
  if(clr) clr.addEventListener("click", function(){
    INVF.abc=null; INVF.xyz=null; INVF.salud=null; INVF.cat=null; INVF.q="";
    render(tabActivo());
  });
  var q = document.getElementById("invQ");
  if(q) q.addEventListener("input", function(){
    INVF.q = q.value;
    clearTimeout(INVF._t);
    INVF._t = setTimeout(function(){
      render(tabActivo());
      var n = document.getElementById("invQ");
      if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 180);
  });
  var cat = document.getElementById("invCat");
  if(cat) cat.addEventListener("change", function(){
    INVF.cat = cat.value || null; render(tabActivo());
  });
  montaTip();
}

/* Tooltip de un solo nodo, reutilizado. Sin librerias. */
function montaTip(){
  var tip = document.getElementById("tipbox");
  if(!tip){
    tip = document.createElement("div"); tip.id="tipbox"; tip.className="tipbox"; tip.hidden=true;
    document.body.appendChild(tip);
  }
  document.getElementById("panel").querySelectorAll("[data-tip]").forEach(function(n){
    n.addEventListener("mouseenter", function(){
      tip.textContent = n.dataset.tip; tip.hidden=false;
    });
    n.addEventListener("mousemove", function(e){
      var w = tip.offsetWidth, x = Math.min(window.innerWidth-w-10, e.clientX+14);
      tip.style.left = x+"px"; tip.style.top = (e.clientY+16)+"px";
    });
    n.addEventListener("mouseleave", function(){ tip.hidden=true; });
  });
}

/* ---------- Render ---------- */
var SEC = "fin";
var TABS = {
  fin: [["EC","Ecuador · VICOMER"],["CO","Colombia · VINTRAL"],["GR","Grupo"]],
  ven: [["EC","Ecuador"],["CO","Colombia"],["CR","Costa Rica"],["GR","Grupo"]],
  inv: [["EC","Ecuador · VICOMER"],["CO","Colombia · VINTRAL"],["CR","Costa Rica"],["GR","Grupo"]]
};
function pintaTabs(activo){
  var L = TABS[SEC];
  if(!L.filter(function(x){ return x[0] === activo; }).length) activo = L[0][0];
  document.getElementById("tabs").innerHTML = L.map(function(x){
    return '<button class="tab" role="tab" data-t="'+x[0]+'" aria-selected="'+
      (x[0]===activo)+'">'+esc(x[1])+'</button>'; }).join("");
  return activo;
}
function tabActivo(){
  var b = document.querySelector('.tab[aria-selected="true"]');
  return b ? b.dataset.t : TABS[SEC][0][0];
}
function render(t){
  var el = document.getElementById("panel");
  if(SEC === "inv"){ el.innerHTML = renderInv(t); enganchaInv(); return; }
  if(SEC === "ven"){ el.innerHTML = renderVentas(t); enganchaExp(); return; }
  if(t==="GR"){ el.innerHTML = grupo(); enganchaExp(); return; }
  var d = construirPais(t, RA, RB);
  if(!d){
    el.innerHTML = '<div class="hueco"><b>Sin período completo en este rango</b>'+
      'Ningún período contable de '+esc(DATA[t].pais)+' cae entero dentro del rango elegido. '+
      'Ampliá el rango o usá uno de los atajos.</div>';
    return;
  }
  var base = DATA[t], i = d.ind, f = base.fiscal || {};
  var mon = (d.moneda==="USD") ? "dólares"
          : ((CUR==="USD") ? "dólares a la TRM del día" : "pesos colombianos");
  // El detalle por cuenta y el bloque fiscal existen solo para el corte completo del año.
  var esCorte = d.esYTD && d.corte_balance === DATA.meta.corte_iso;
  if(esCorte && base.ind){
    // Fusionar sin pisar: lo que el rango calculó manda; lo que solo existe en el corte
    // (EBITDA, depreciación, DSO externo, DIO partido, tasa implícita) se agrega.
    for(var kk in base.ind) if(d.ind[kk] === undefined || d.ind[kk] === null) d.ind[kk] = base.ind[kk];
    d.fiscal = base.fiscal;        // la carga tributaria solo se calcula sobre el corte completo
    d.detalle_pl = base.detalle_pl; // y el detalle por cuenta también
    d.detalle_bg = base.detalle_bg;
    i = d.ind;
  }

  var h = huecoHTML(d) + costoHTML(d,t);
  if(esCorte && base.veredicto)
    h += '<div class="card vd"><h2>Lectura en 30 segundos</h2><p>'+esc(base.veredicto)+'</p></div>';

  var vta = linea(d,"s").v, meses = Math.max(1, Math.round(d.dias/30.4));
  var ub = d.pl.filter(function(x){return x.t==="S";})[0];
  var neto = linea(d,"F");
  var netoMostrar = (esCorte && f.estimado) ? f.utilidad_neta_estimada : neto.v;
  h += '<div class="kpis">'+
    kpi("Ingresos netos", kM(vta,t), kM(vta/meses,t)+" por mes · "+esc(d.periodo))+
    kpi("Margen bruto", i.mb===null?"—":pct(i.mb), i.mb===null?"no medible en este rango":kM(ub.v,t))+
    kpi("EBITDA", esCorte?kM(i.ebitda,t):"—",
        esCorte?(i.m_ebitda===null?"":pct(i.m_ebitda)+" de las ventas"):"solo sobre el corte completo")+
    kpi((esCorte && f.estimado) ? "Utilidad neta estimada" : "Resultado del período",
        kM(netoMostrar,t),
        (esCorte && f.estimado) ? "tras participación e IR que el ERP no provisiona"
                                : (i.mn===null?"sobre ventas: no medible":pct(i.mn)+" de las ventas"),
        netoMostrar>=0?"pos":"neg")+
    kpi("Ciclo de caja", i.ccc===null?"—":i.ccc+" días",
        i.ccc===null?"sin costo registrado"
          :("Cobro "+(i.dso_externo||i.dso)+" + Inv "+((i.dio_almacen||0)+(i.dio_transito||0) || i.dio)+" − Pago "+i.dpo),
        (i.ccc||0)>180?"neg":"warn")+
    kpi("Tasa efectiva", (esCorte && f.tasa_efectiva!==null&&f.tasa_efectiva!==undefined)?pct(f.tasa_efectiva):"—",
        esCorte?(f.estimado?"estimada: 15% participación + 25% renta":"registrada en el ERP"):"solo sobre el corte completo",
        (esCorte && (f.tasa_efectiva||0)>0.33)?"warn":"")+
  '</div>';

  var btn = esCorte
    ? '<button class="pre" id="expAll" style="float:right">Expandir todo</button>' : '';
  h += '<div class="grid2">'+
    '<div class="card">'+btn+'<h2>Estado de resultados</h2><p class="cap">'+esc(d.periodo)+
      ' · en '+mon+(esCorte?' · tocá una línea para abrirla hasta la subcuenta':
        ' · el detalle por cuenta existe solo sobre el corte completo')+'</p>'+
      plExpand(d,t,esCorte)+'</div>'+
    '<div class="card"><h2>Estado de situación financiera</h2><p class="cap">Foto al '+
      esc(fechaLarga(d.corte_balance))+' · en '+mon+' · un saldo no se suma</p>'+
      bgExpand(d,t,esCorte)+'</div>'+
  '</div>';

  if(esCorte)
    h += '<div class="card"><h2>De cada 100 vendidos, ¿qué queda?</h2>'+
      '<p class="cap">Puente del ingreso al resultado, en porcentaje de la venta</p>'+
      puente100(base,t)+'</div>';

  h += '<h2 class="secth">Indicadores</h2>' + indicadoresGrupos(d,t);

  if(esCorte)
    h += '<div class="card"><h2>Alertas y acciones</h2>'+
      '<p class="cap">Ordenadas por severidad · tocá cada una para ver qué vemos y qué hacer</p>'+
      alertas(base,t)+'</div>'+
      '<div class="card"><h2>Fuentes, supuestos y método</h2>'+pieMetodo(d,t)+'</div>';

  el.innerHTML = h;
  enganchaExp();
}

function enganchaExp(){
  var el = document.getElementById("panel");
  el.querySelectorAll(".exp").forEach(function(x){
    x.addEventListener("click", function(e){
      if(e.target.closest("button")) return;
      var k = x.dataset.k; if(!k) return;
      ABIERTO[k] = !ABIERTO[k];
      render(tabActivo());
    });
  });
  var b = document.getElementById("expAll");
  if(b) b.addEventListener("click", function(e){
    e.stopPropagation();
    var abrir = !Object.keys(ABIERTO).filter(function(k){ return ABIERTO[k]; }).length;
    el.querySelectorAll(".exp").forEach(function(x){ if(x.dataset.k) ABIERTO[x.dataset.k] = abrir; });
    render(tabActivo());
  });
}

document.getElementById("secs").addEventListener("click", function(e){
  var b = e.target.closest(".sec"); if(!b) return;
  SEC = b.dataset.s;
  document.querySelectorAll("#secs .sec").forEach(function(x){
    x.setAttribute("aria-pressed", String(x.dataset.s === SEC)); });
  pintaFuente();
  pintaTabs(tabActivo());
  aplicar(RA, RB);
});
document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll(".tab").forEach(function(x){
    x.setAttribute("aria-selected", String(x===b)); });
  render(b.dataset.t);
});
/* ---------- Controles del rango ---------- */
var PRESETS = [
  {id:"ytd",  txt:"Año a la fecha"},
  {id:"tri",  txt:"Último trimestre"},
  {id:"mes",  txt:"Último mes"},
  {id:"ofi",  txt:"Ene–Jul (cierre oficial)"}
];
function ultimoMes(){ return (DATA.serie.meses || []).length; }
function rangoPreset(id){
  var u = ultimoMes();
  if(id==="ytd") return [1,u];
  if(id==="tri") return [Math.max(1,u-2),u];
  if(id==="mes") return [u,u];
  return [1,7];
}
function fechaLarga(iso){
  var M=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
         "septiembre","octubre","noviembre","diciembre"];
  var p=String(iso).split("-");
  return parseInt(p[2],10)+" de "+M[parseInt(p[1],10)-1]+" de "+p[0];
}
function rangoTexto(){
  var m = DATA.serie.meses;
  return (RA===RB ? m[RA-1] : m[RA-1]+" – "+m[RB-1]) + " " + DATA.meta.anio_txt;
}
function montaRango(){
  var m = DATA.serie.meses, A=document.getElementById("rDesde"), B=document.getElementById("rHasta");
  [A,B].forEach(function(sel){
    sel.innerHTML = m.map(function(x,i){
      return '<option value="'+(i+1)+'">'+x+'</option>'; }).join("");
  });
  document.getElementById("presets").innerHTML = PRESETS.map(function(pz){
    return '<button class="pre" data-p="'+pz.id+'" aria-pressed="false">'+pz.txt+'</button>';
  }).join("");
  var def = DATA.meta.rango_defecto || [1, ultimoMes()];
  aplicar(def[0], def[1]);
  A.addEventListener("change", function(){ aplicar(+A.value, Math.max(+A.value, RB)); });
  B.addEventListener("change", function(){ aplicar(Math.min(RA, +B.value), +B.value); });
  document.getElementById("presets").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    var r=rangoPreset(b.dataset.p); aplicar(r[0], r[1]);
  });
}
function aplicar(a,b){
  RA = Math.max(1, Math.min(a,b)); RB = Math.min(ultimoMes(), Math.max(a,b));
  document.getElementById("rDesde").value = RA;
  document.getElementById("rHasta").value = RB;
  document.querySelectorAll("#presets .pre").forEach(function(btn){
    var r=rangoPreset(btn.dataset.p);
    btn.setAttribute("aria-pressed", String(r[0]===RA && r[1]===RB));
  });
  // La nota dice SIEMPRE las dos cosas: que el P&G es del rango y el balance del cierre.
  var cods = Object.keys(DATA).filter(function(k){
    return k!=="meta" && k!=="conc" && k!=="serie" && DATA[k] && DATA[k].pl; });
  var avisos = [];
  cods.forEach(function(k){
    var d = construirPais(k, RA, RB);
    if(!d){ avisos.push(DATA[k].pais+" no tiene ningún período completo en este rango"); return; }
    if(d.fuera.length) avisos.push(DATA[k].pais+" deja fuera "+
      d.fuera.map(function(x){return x.etiqueta;}).join(", ")+", que no se puede partir");
  });
  var n = document.getElementById("rNota");
  n.innerHTML = (SEC === "inv"
      ? "Demanda del rango <b>"+esc(rangoTexto())+"</b>; existencias a la foto del "+
        esc(DATA.meta.corte)+". La extracción no guarda histórico de stock, así que el saldo "+
        "no se mueve con el rango."
      : SEC === "ven"
      ? "Facturación del rango <b>"+esc(rangoTexto())+"</b>; cartera a la foto del cierre de "+
        esc(DATA.serie.meses[RB-1])+". Un saldo no se suma."
      : "Estado de resultados del rango <b>"+esc(rangoTexto())+"</b>; balance a la foto del "+
        "cierre de "+esc(DATA.serie.meses[RB-1])+". Un saldo no se suma.") +
    (avisos.length && SEC === "fin" ? "  <b>Ojo:</b> "+esc(avisos.join(" · "))+"." : "");
  if(document.getElementById("tabs").children.length) render(tabActivo());
}

function pintaFuente(){
  var m = DATA.meta;
  var e = document.getElementById("fuenteSub");
  if(e) e.textContent = (SEC === "inv"
      ? "Existencias y demanda por referencia desde Odoo"
      : SEC === "ven"
      ? "Facturación y cartera desde Odoo"
      : "Balance y estado de resultados desde Odoo") +
      " · las cifras son del corte, la conversión a dólares es del día";
  var cods = Object.keys(DATA).filter(function(k){
    return k!=="meta" && k!=="conc" && DATA[k] && DATA[k].pl; });
  var per = document.getElementById("perBadge");
  if(per) per.textContent = "Grupo VICOMER · " + rangoTexto();
  // El cuadre no se afirma: se mide sobre los datos que la pagina esta mostrando.
  var peor = 0;
  cods.forEach(function(k){
    var b=DATA[k].bg;
    var dif = (b.descuadre_esperado!==undefined) ? b.descuadre_esperado
            : (sum(b.activo)+sum(b.activo_nc)-sum(b.pasivo)-sum(b.pasivo_nc)-sum(b.patrimonio));
    if(Math.abs(dif) > Math.abs(peor)) peor = dif;
  });
  var cb = document.getElementById("cuadreBadge");
  if(cb && SEC !== "fin"){ cb.hidden = true; }
  else if(cb){
    cb.hidden = false;
    cb.textContent = Math.abs(peor) < 1 ? "Balances cerrados · descuadre cero"
                                        : "Descuadre máximo "+fm(peor,2);
    cb.className = Math.abs(peor) >= 1 ? "badge w" : "badge";
  }
  var pie = document.getElementById("pie");
  if(pie) pie.textContent =
    (m._nota_fuente || "") + " Las cifras no se ajustaron: los descuadres y las partidas discutibles " +
    "se muestran, no se corrigen. Conversión a dólares con la TRM del " + m.trm_fuente + " del " +
    m.trm_fecha + " (" + fm(m.trm,2) + " COP/USD); sirve para comparar, no reemplaza una consolidación " +
    "con eliminaciones intercompañía. " + (m._nota_trm || "");
}
function pintaAntiguedad(){
  // Un tablero financiero que no dice cuan viejo es su corte invita a leerlo como si
  // fuera de hoy. El numero de dias va a la vista, y en ambar cuando ya pesa.
  var b = document.getElementById("antBadge");
  if(!b || !DATA.meta.corte_iso){ if(b) b.hidden = true; return; }
  var c = new Date(DATA.meta.corte_iso + "T00:00:00");
  var dias = Math.round((Date.now() - c.getTime()) / 86400000);
  b.hidden = false;
  b.textContent = "Corte " + DATA.meta.corte + " · hace " + dias + " días" +
    (dias > 10 ? " · la corrida semanal no actualizó" : "");
  // Umbral bajado de 45 a 10 días el 26-oct-2026: tres corridas automáticas seguidas
  // fallaron en silencio (9, 16 y 23 de octubre) y el tablero estuvo 16 días mostrando
  // cifras viejas sin ninguna marca. Con corte semanal, 10 días ya es una corrida perdida.
  if(dias > 10) b.className = "badge w";
}
function pintaTC(){
  var f = new Intl.NumberFormat("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById("tcBadge").textContent =
    "TRM " + f.format(DATA.meta.trm) + " COP/USD · " + DATA.meta.trm_fecha;
  document.querySelectorAll("#curTog button").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset.c === CUR)); });
}
document.getElementById("curTog").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  CUR = b.dataset.c; pintaTC();
  render(document.querySelector('.tab[aria-selected="true"]').dataset.t);
});
pintaTabs("EC");
montaRango();
pintaFuente();
pintaAntiguedad();
pintaTC();
render("EC");
</script>
